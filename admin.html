  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--blue:#007AB0;--blue2:#005A8C;--green:#40AF36;--orange:#FF9800;--red:#dc2626;--bg:#f3f6fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--border:#e5e7eb;--softBlue:#e5f2f7;}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI','Noto Sans TC',Arial,sans-serif;} button,input,select{font-family:inherit} .hidden{display:none!important}
    .login-page{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr;background:linear-gradient(135deg,#e5f2f7 0%,#f8fafc 55%,#e0f7f0 100%)}
    .hero{padding:64px;display:flex;flex-direction:column;justify-content:center}.hero-badge{display:inline-block;width:max-content;background:#fff;border:1px solid #dbeafe;border-radius:999px;padding:8px 14px;color:var(--blue);font-weight:800;font-size:13px;margin-bottom:22px}.hero h1{font-size:46px;line-height:1.14;margin:0 0 16px;color:#0f172a}.hero p{font-size:17px;line-height:1.8;color:#475569;max-width:620px}.hero-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:28px;max-width:650px}.hero-card{background:rgba(255,255,255,.8);border:1px solid #dbeafe;border-radius:16px;padding:18px}.hero-card strong{display:block;font-size:24px;color:var(--blue);margin-bottom:5px}.hero-card span{font-size:13px;color:#64748b;font-weight:700}.login-wrap{display:flex;align-items:center;justify-content:center;padding:40px}.login-card{width:100%;max-width:430px;background:#fff;border:1px solid var(--border);border-radius:24px;padding:34px;box-shadow:0 24px 70px rgba(15,23,42,.12)}.login-card h2{margin:0 0 8px;font-size:26px;color:var(--blue)}.login-card p{margin:0 0 22px;color:var(--muted);line-height:1.7}.field{margin-bottom:16px}.field label{display:block;font-size:13px;color:#374151;font-weight:800;margin-bottom:7px}.field input,.field select{width:100%;border:1px solid #d1d5db;border-radius:10px;padding:12px 13px;font-size:15px;background:white}.field input:focus,.field select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,122,176,.12)}.btn{border:none;border-radius:10px;padding:11px 14px;font-size:14px;font-weight:850;cursor:pointer;transition:.15s}.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:var(--blue2)}.btn-green{background:var(--green);color:#fff}.btn-orange{background:var(--orange);color:#fff}.btn-danger{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}.btn-gray{background:#f3f4f6;color:#374151;border:1px solid #d1d5db}.btn:disabled{opacity:.55;cursor:not-allowed}.msg{padding:11px 12px;border-radius:10px;font-size:13px;margin:12px 0}.msg.error{background:#fee2e2;color:#7f1d1d}.msg.ok{background:#dcfce7;color:#166534}.msg.info{background:#e5f2f7;color:#075985}.app{min-height:100vh;display:grid;grid-template-columns:260px 1fr}.sidebar{background:#0f172a;color:#fff;padding:22px;display:flex;flex-direction:column;gap:18px}.brand{padding-bottom:18px;border-bottom:1px solid rgba(255,255,255,.12)}.brand h1{font-size:20px;line-height:1.35;margin:0 0 8px}.brand span{font-size:12px;color:#cbd5e1}.nav{display:flex;flex-direction:column;gap:8px}.nav button{width:100%;text-align:left;background:transparent;color:#cbd5e1;border:none;border-radius:12px;padding:12px 14px;font-weight:800;cursor:pointer}.nav button.active,.nav button:hover{background:rgba(255,255,255,.11);color:white}.side-footer{margin-top:auto;border-top:1px solid rgba(255,255,255,.12);padding-top:16px;font-size:12px;color:#cbd5e1}.topbar{height:74px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:10}.topbar h2{margin:0;color:#0f172a;font-size:22px}.userbox{display:flex;align-items:center;gap:12px}.avatar{width:38px;height:38px;border-radius:50%;background:var(--softBlue);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:900}.content{padding:28px;max-width:1600px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}.stat{background:#fff;border:1px solid var(--border);border-radius:18px;padding:18px;box-shadow:0 8px 24px rgba(15,23,42,.04)}.stat .label{font-size:12px;color:var(--muted);font-weight:800}.stat .num{font-size:30px;font-weight:900;margin-top:8px;color:var(--blue)}.panel{background:#fff;border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:18px;box-shadow:0 8px 24px rgba(15,23,42,.04)}.panel h3{margin:0 0 14px;font-size:17px;color:var(--blue)}.tools{display:grid;grid-template-columns:1.3fr repeat(4,1fr) auto;gap:10px;margin-bottom:14px;align-items:end}.tools input,.tools select,.inline-form input,.inline-form select{border:1px solid #d1d5db;border-radius:10px;padding:10px;font-size:13px}.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:12px}table{width:100%;border-collapse:collapse;background:white;font-size:13px;min-width:900px}th{background:#f8fafc;text-align:left;color:#475569;font-size:12px;padding:11px;border-bottom:1px solid var(--border);white-space:nowrap}td{padding:11px;border-bottom:1px solid #f1f5f9;white-space:nowrap}tr:hover td{background:#f8fafc}.tag{display:inline-block;padding:4px 8px;border-radius:999px;font-weight:800;font-size:12px}.tag.blue{background:#e5f2f7;color:var(--blue)}.tag.green{background:#dcfce7;color:#166534}.tag.gray{background:#f3f4f6;color:#374151}.pager{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:13px;color:#475569}.pager-controls{display:flex;gap:8px;align-items:center}.inline-form{display:grid;grid-template-columns:repeat(5,1fr) auto;gap:10px;align-items:end}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px}.alert{border-left:4px solid var(--orange);background:#fff7ed;color:#9a3412;padding:12px;border-radius:10px;margin-bottom:14px;font-size:13px;line-height:1.6}.account-row{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px}.account-row strong{color:#0f172a}.small{font-size:12px;color:var(--muted);line-height:1.6}.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:9999}.modal-card{background:#fff;border-radius:18px;padding:22px;max-width:420px;width:92%;box-shadow:0 24px 70px rgba(0,0,0,.2)}.modal-card h3{margin:0 0 10px;color:#0f172a}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}@media(max-width:1100px){.login-page{grid-template-columns:1fr}.hero{display:none}.app{grid-template-columns:1fr}.sidebar{position:static}.nav{display:grid;grid-template-columns:repeat(3,1fr)}.cards{grid-template-columns:repeat(2,1fr)}.tools{grid-template-columns:1fr 1fr}.inline-form{grid-template-columns:1fr 1fr}.two-col{grid-template-columns:1fr}}@media(max-width:700px){.content{padding:16px}.cards{grid-template-columns:1fr}.nav{grid-template-columns:1fr}.topbar{padding:0 16px}.topbar h2{font-size:18px}}
  </style>
</head>
<body>
  <section id="loginPage" class="login-page">
    <div class="hero">
      <div class="hero-badge">Metro Inn Admin Console</div>
      <h1>長租場地抽籤登記後台</h1>
      <p>電腦版管理介面，支援登記資料查詢、分頁、名額設定、抽籤、匯出，以及後台帳號權限管理。</p>
      <div class="hero-grid">
        <div class="hero-card"><strong>權限</strong><span>帳密登入與角色控管</span></div>
        <div class="hero-card"><strong>搜尋</strong><span>姓名、手機、序號快速查詢</span></div>
        <div class="hero-card"><strong>抽籤</strong><span>篩選後一鍵抽籤</span></div>
      </div>
    </div>
    <div class="login-wrap">
      <div class="login-card">
        <h2>後台登入</h2>
        <p>請輸入管理者帳號與密碼。若尚未建立帳號，請先依下方 SQL 建立帳號資料表，第一次可建立超級管理員。</p>
        <div id="bootstrapBox" class="hidden">
          <div class="msg info">系統目前沒有後台帳號，請先建立第一個超級管理員。</div>
          <div class="field"><label>管理員帳號</label><input id="firstUsername" placeholder="例如 admin"></div>
          <div class="field"><label>顯示名稱</label><input id="firstDisplayName" placeholder="例如 Christina"></div>
          <div class="field"><label>密碼</label><input id="firstPassword" type="password" placeholder="請設定高強度密碼"></div>
          <button id="createFirstAdminBtn" class="btn btn-green" style="width:100%;">建立第一個管理員</button>
          <hr style="border:none;border-top:1px solid var(--border);margin:22px 0;">
        </div>
        <div id="loginBox">
          <div class="field"><label>帳號</label><input id="loginUsername" autocomplete="username" placeholder="請輸入帳號"></div>
          <div class="field"><label>密碼</label><input id="loginPassword" type="password" autocomplete="current-password" placeholder="請輸入密碼"></div>
          <button id="loginBtn" class="btn btn-primary" style="width:100%;">登入後台</button>
        </div>
        <div id="loginMsg"></div>
      </div>
    </div>
  </section>

  <section id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brand"><h1>長租場地抽籤登記後台</h1><span>Admin Console</span></div>
      <nav class="nav">
        <button data-page="dashboard" class="active">📊 總覽儀表板</button>
        <button data-page="records">📋 登記資料</button>
        <button data-page="capacity">🎯 名額設定</button>
        <button data-page="lottery">🎲 抽籤作業</button>
        <button data-page="accounts" id="accountsNav">👤 帳號權限</button>
      </nav>
      <div class="side-footer"><div id="sideUser">-</div><button id="logoutBtn" class="btn btn-gray" style="width:100%;margin-top:10px;">登出</button></div>
    </aside>
    <main>
      <header class="topbar"><h2 id="pageTitle">總覽儀表板</h2><div class="userbox"><div class="avatar" id="userAvatar">A</div><div><div id="topUser" style="font-weight:900;">-</div><div id="topRole" class="small">-</div></div></div></header>
      <div class="content" id="content"></div>
    </main>
  </section>

<script>
const SUPABASE_URL = 'https://wsvsdwuksuzcjisnpyin.supabase.co';
const SUPABASE_KEY = 'sb_publishable_bH4MK0hvMqMSel3agqVwcw_aFsF3nIl';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const ADMIN_TABLE = 'admin_users';
const RECORD_TABLE = 'lottery_records';
const CAPACITY_TABLE = 'lottery_capacity_settings';
let currentAdmin = null;
let allRecords = [];
let capacitySettings = {};
let recordState = { q:'', venue:'', day:'', time:'', page:1, perPage:20 };
let currentPage = 'dashboard';

const venueOrder = ['羽球','籃球','B1桌球','B2桌球'];
const days = ['周一','周二','周三','周四','周五','周六','周日'];
const capacityMap = {'羽球':3,'籃球':1,'B1桌球':5,'B2桌球':4};

function showMsg(el, text, type='error'){ document.getElementById(el).innerHTML = `<div class="msg ${type}">${text}</div>`; }
function roleName(role){ return role === 'super_admin' ? '超級管理員' : '一般管理員'; }
function normalizePhone(v){ return (v||'').replace(/\s|-/g,''); }
function getTimeOptionsForVenue(venue){ return venue && venue.includes('桌球') ? ['09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00','19:00','20:00','21:00'] : ['06:00','08:00','10:00','12:00','14:00','16:00','18:00','20:00']; }
function formatTimeSlotDisplay(startTime, isTableTennis){ const h=parseInt(startTime.split(':')[0],10); return `${startTime}-${String(h+1).padStart(2,'0')}:59`; }
function settingKey(venue, day, timeSlot){ return `${venue}|${day}|${timeSlot}`; }
function getWinnerCount(venue, day, startTime){ const slot=formatTimeSlotDisplay(startTime, venue && venue.includes('桌球')); const key=settingKey(venue,day,slot); return capacitySettings[key] ?? capacityMap[venue] ?? 0; }
function countSlot(venue,day,startTime){ return allRecords.filter(r=>r.venue_type===venue && r.day_of_week===day && (r.time_slot||'').includes(startTime)).length; }
function recordHours(r){ const t=r.time_slot||''; const sh=parseInt(t.split('-')[0],10); const eh=parseInt((t.split('-')[1]||'').split(':')[0],10); if(!isNaN(sh)&&!isNaN(eh)) return eh-sh+1; return (r.venue_type||'').includes('桌球') ? 1 : 2; }
function escapeHtml(s){ return String(s??'').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }

async function sha256(text){ const enc=new TextEncoder(); const buf=await crypto.subtle.digest('SHA-256', enc.encode(text)); return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join(''); }
function randomSalt(){ return crypto.getRandomValues(new Uint8Array(16)).reduce((s,b)=>s+b.toString(16).padStart(2,'0'),''); }
async function makeHash(password, salt){ return sha256(`${salt}:${password}`); }

async function loadAdmins(){ const {data,error}=await db.from(ADMIN_TABLE).select('*').order('created_at',{ascending:true}); if(error){ showMsg('loginMsg','讀取管理帳號失敗。請先確認已建立 admin_users 資料表與 RLS 權限。','error'); console.error(error); return null; } return data||[]; }
async function checkBootstrap(){ const admins=await loadAdmins(); if(!admins) return; if(admins.length===0){ document.getElementById('bootstrapBox').classList.remove('hidden'); document.getElementById('loginBox').classList.add('hidden'); } }
async function createAdminAccount({username, display_name, password, role='staff'}){ const salt=randomSalt(); const password_hash=await makeHash(password,salt); const payload={username, display_name, role, salt, password_hash, is_active:true, created_at:new Date().toISOString(), updated_at:new Date().toISOString()}; const {error}=await db.from(ADMIN_TABLE).insert([payload]); if(error){ console.error(error); throw error; } }
async function login(){ const username=document.getElementById('loginUsername').value.trim(); const password=document.getElementById('loginPassword').value; if(!username||!password){ showMsg('loginMsg','請輸入帳號與密碼'); return; } const {data,error}=await db.from(ADMIN_TABLE).select('*').eq('username',username).limit(1).single(); if(error||!data){ showMsg('loginMsg','帳號或密碼錯誤'); return; } if(!data.is_active){ showMsg('loginMsg','此帳號已停用'); return; } const hash=await makeHash(password,data.salt); if(hash!==data.password_hash){ showMsg('loginMsg','帳號或密碼錯誤'); return; } currentAdmin={id:data.id,username:data.username,display_name:data.display_name,role:data.role}; sessionStorage.setItem('venue_admin_session', JSON.stringify(currentAdmin)); await enterApp(); }
async function enterApp(){ document.getElementById('loginPage').classList.add('hidden'); document.getElementById('app').classList.remove('hidden'); document.getElementById('topUser').textContent=currentAdmin.display_name||currentAdmin.username; document.getElementById('sideUser').textContent=`${currentAdmin.display_name||currentAdmin.username}｜${roleName(currentAdmin.role)}`; document.getElementById('topRole').textContent=roleName(currentAdmin.role); document.getElementById('userAvatar').textContent=(currentAdmin.display_name||currentAdmin.username||'A').slice(0,1).toUpperCase(); if(currentAdmin.role!=='super_admin') document.getElementById('accountsNav').style.display='none'; await loadAllData(); renderPage('dashboard'); }
function logout(){ sessionStorage.removeItem('venue_admin_session'); location.reload(); }

async function loadAllData(){ const [recordsRes, capRes] = await Promise.all([ db.from(RECORD_TABLE).select('*').order('registered_at',{ascending:false}), db.from(CAPACITY_TABLE).select('*') ]); if(recordsRes.error){ console.error(recordsRes.error); alert('讀取登記資料失敗'); } allRecords=(recordsRes.data||[]).map(r=>({...r,__backendId:r.id})); if(!capRes.error){ capacitySettings={}; (capRes.data||[]).forEach(row=>{capacitySettings[settingKey(row.venue_type,row.day_of_week,row.time_slot)] = Number(row.winner_count||0);}); } }
function stats(records=allRecords){ const total=records.length; const people=new Set(records.map(r=>normalizePhone(r.phone))).size; const hours=records.reduce((s,r)=>s+recordHours(r),0); const byVenue={}; records.forEach(r=>{ const v=r.venue_type||'未分類'; if(!byVenue[v]) byVenue[v]={count:0,people:new Set(),hours:0}; byVenue[v].count++; byVenue[v].people.add(normalizePhone(r.phone)); byVenue[v].hours+=recordHours(r); }); Object.keys(byVenue).forEach(v=>byVenue[v].people=byVenue[v].people.size); return {total,people,hours,byVenue}; }
function renderCards(s){ return `<div class="cards"><div class="stat"><div class="label">登記筆數</div><div class="num">${s.total}</div></div><div class="stat"><div class="label">登記人數</div><div class="num" style="color:var(--green)">${s.people}</div></div><div class="stat"><div class="label">總登記時數</div><div class="num" style="color:var(--orange)">${s.hours}</div></div><div class="stat"><div class="label">資料更新</div><div class="num" style="font-size:20px">即時</div></div></div>`; }
function setActiveNav(page){ document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active', b.dataset.page===page)); const title={dashboard:'總覽儀表板',records:'登記資料',capacity:'抽籤名額設定',lottery:'抽籤作業',accounts:'帳號權限管理'}[page]; document.getElementById('pageTitle').textContent=title; }
function renderPage(page){ if(page==='accounts' && currentAdmin.role!=='super_admin'){ alert('此功能限超級管理員使用'); return; } currentPage=page; setActiveNav(page); if(page==='dashboard') renderDashboard(); if(page==='records') renderRecordsPage(); if(page==='capacity') renderCapacityPage(); if(page==='lottery') renderLotteryPage(); if(page==='accounts') renderAccountsPage(); }
function renderDashboard(){ const s=stats(); let venueHtml=venueOrder.map(v=>{const d=s.byVenue[v]||{count:0,people:0,hours:0}; return `<div class="stat"><div class="label">${v}</div><div class="num">${d.count}</div><div class="small">${d.people} 人｜${d.hours} 小時</div></div>`}).join(''); document.getElementById('content').innerHTML=renderCards(s)+`<div class="panel"><h3>🏆 運動類型統計</h3><div class="cards">${venueHtml}</div></div><div class="panel"><h3>⚠️ 後台安全提醒</h3><div class="alert">目前後台已改為專屬網址與帳號密碼登入。這適合 MVP 與內部測試；正式營運若要更高資安，建議改用 Supabase Auth + Edge Function。</div></div>`; }
function getFilteredRecords(){ const q=recordState.q.trim().toLowerCase(); return allRecords.filter(r=>{ if(recordState.venue && r.venue_type!==recordState.venue) return false; if(recordState.day && r.day_of_week!==recordState.day) return false; if(recordState.time && r.time_slot!==recordState.time) return false; if(q){ const hay=`${r.name||''} ${r.phone||''} ${r.serial_number||''}`.toLowerCase(); if(!hay.includes(q)) return false; } return true; }); }
function renderRecordsPage(){ const venues=[...new Set(allRecords.map(r=>r.venue_type).filter(Boolean))]; const times=[...new Set(allRecords.map(r=>r.time_slot).filter(Boolean))]; document.getElementById('content').innerHTML=`${renderCards(stats())}<div class="panel"><h3>📋 詳細登記資料</h3><div class="tools"><input id="searchQ" placeholder="搜尋姓名／手機／序號" value="${escapeHtml(recordState.q)}"><select id="filterVenue"><option value="">全部類型</option>${venues.map(v=>`<option ${recordState.venue===v?'selected':''} value="${v}">${v}</option>`).join('')}</select><select id="filterDay"><option value="">全部星期</option>${days.map(d=>`<option ${recordState.day===d?'selected':''} value="${d}">${d}</option>`).join('')}</select><select id="filterTime"><option value="">全部時段</option>${times.map(t=>`<option ${recordState.time===t?'selected':''} value="${t}">${t}</option>`).join('')}</select><select id="perPage"><option value="20">每頁20筆</option><option value="50">每頁50筆</option><option value="100">每頁100筆</option></select><button id="exportBtn" class="btn btn-green">匯出</button></div><div id="recordsTable"></div></div>`; document.getElementById('perPage').value=String(recordState.perPage); ['searchQ','filterVenue','filterDay','filterTime','perPage'].forEach(id=>{ document.getElementById(id).addEventListener(id==='searchQ'?'input':'change',()=>{ recordState.q=document.getElementById('searchQ').value; recordState.venue=document.getElementById('filterVenue').value; recordState.day=document.getElementById('filterDay').value; recordState.time=document.getElementById('filterTime').value; recordState.perPage=parseInt(document.getElementById('perPage').value,10); recordState.page=1; renderRecordsTable(); }); }); document.getElementById('exportBtn').onclick=()=>exportToCsv(getFilteredRecords()); renderRecordsTable(); }
function renderRecordsTable(){ const filtered=getFilteredRecords(); const totalPages=Math.max(1,Math.ceil(filtered.length/recordState.perPage)); if(recordState.page>totalPages) recordState.page=totalPages; const start=(recordState.page-1)*recordState.perPage; const rows=filtered.slice(start,start+recordState.perPage); let html=`<div class="small" style="margin-bottom:10px">共 ${filtered.length} 筆，顯示第 ${start+1}-${Math.min(start+recordState.perPage,filtered.length)} 筆</div><div class="table-wrap"><table><thead><tr><th>項次</th><th>序號</th><th>姓名</th><th>手機</th><th>類型</th><th>星期</th><th>時段</th><th>時數</th><th>登記時間</th><th>操作</th></tr></thead><tbody>`; rows.forEach((r,i)=>{ html+=`<tr><td>${start+i+1}</td><td><strong>${escapeHtml(r.serial_number)}</strong></td><td>${escapeHtml(r.name)}</td><td>${escapeHtml(r.phone)}</td><td><span class="tag blue">${escapeHtml(r.venue_type)}</span></td><td>${escapeHtml(r.day_of_week)}</td><td>${escapeHtml(r.time_slot)}</td><td>${recordHours(r)}h</td><td>${r.registered_at?new Date(r.registered_at).toLocaleString('zh-TW',{hour12:false}):''}</td><td><button class="btn btn-danger" data-del="${r.id}">刪除</button></td></tr>`; }); html+=`</tbody></table></div><div class="pager"><div>第 ${recordState.page} / ${totalPages} 頁</div><div class="pager-controls"><button id="prevPage" class="btn btn-gray">上一頁</button><button id="nextPage" class="btn btn-gray">下一頁</button></div></div>`; document.getElementById('recordsTable').innerHTML=html; document.getElementById('prevPage').disabled=recordState.page<=1; document.getElementById('nextPage').disabled=recordState.page>=totalPages; document.getElementById('prevPage').onclick=()=>{recordState.page--;renderRecordsTable();}; document.getElementById('nextPage').onclick=()=>{recordState.page++;renderRecordsTable();}; document.querySelectorAll('[data-del]').forEach(btn=>btn.onclick=()=>confirmDelete(btn.dataset.del)); }
function confirmDelete(id){ const r=allRecords.find(x=>x.id===id); showModal('確認刪除',`確定刪除 ${escapeHtml(r?.name||'')} 的登記資料嗎？`,async()=>{ const serial=r?.serial_number; const ids=allRecords.filter(x=>x.serial_number===serial).map(x=>x.id); const {error}=await db.from(RECORD_TABLE).delete().in('id',ids); if(error) alert('刪除失敗'); await loadAllData(); renderPage(currentPage); }); }
function renderCapacityPage(){ document.getElementById('content').innerHTML=`<div class="panel"><h3>🎯 抽籤名額設定</h3><div class="inline-form"><div><label class="small">運動類型</label><select id="capVenue">${venueOrder.map(v=>`<option>${v}</option>`)}</select></div><div><label class="small">星期</label><select id="capDay">${days.map(d=>`<option>${d}</option>`)}</select></div><div><label class="small">時段</label><select id="capTime"></select></div><div><label class="small">抽籤名額</label><input id="capCount" type="number" min="0" value="1"></div><div></div><button id="saveCapBtn" class="btn btn-primary">儲存</button></div><div id="capInfo" class="msg info"></div></div><div class="panel"><h3>目前已設定名額</h3><div id="capList"></div></div>`; setupCapacityControls(); }
function setupCapacityControls(){ const v=document.getElementById('capVenue'), d=document.getElementById('capDay'), t=document.getElementById('capTime'), c=document.getElementById('capCount'); function refreshTimes(){ t.innerHTML=getTimeOptionsForVenue(v.value).map(x=>`<option value="${x}">${formatTimeSlotDisplay(x,v.value.includes('桌球'))}</option>`).join(''); refreshInfo(); } function refreshInfo(){ const slot=formatTimeSlotDisplay(t.value,v.value.includes('桌球')); const key=settingKey(v.value,d.value,slot); const val=capacitySettings[key] ?? capacityMap[v.value] ?? 0; c.value=val; document.getElementById('capInfo').innerHTML=`${v.value}｜${d.value}｜${slot}：已報 ${countSlot(v.value,d.value,t.value)} / 可用 ${val}`; } [v,d,t].forEach(el=>el.onchange=el===v?refreshTimes:refreshInfo); document.getElementById('saveCapBtn').onclick=async()=>{ const slot=formatTimeSlotDisplay(t.value,v.value.includes('桌球')); const payload={venue_type:v.value,day_of_week:d.value,time_slot:slot,winner_count:Number(c.value||0),updated_at:new Date().toISOString()}; const {error}=await db.from(CAPACITY_TABLE).upsert(payload,{onConflict:'venue_type,day_of_week,time_slot'}); if(error){alert('儲存失敗');console.error(error);return;} await loadAllData(); renderCapacityPage(); }; refreshTimes(); renderCapacityList(); }
function renderCapacityList(){ let rows=[]; venueOrder.forEach(v=>days.forEach(d=>getTimeOptionsForVenue(v).forEach(st=>{ const slot=formatTimeSlotDisplay(st,v.includes('桌球')); const key=settingKey(v,d,slot); if(capacitySettings[key]!==undefined) rows.push({v,d,slot,count:capacitySettings[key],reg:countSlot(v,d,st)}); }))); document.getElementById('capList').innerHTML=rows.length?`<div class="table-wrap"><table><thead><tr><th>類型</th><th>星期</th><th>時段</th><th>已報</th><th>可用</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.v}</td><td>${r.d}</td><td>${r.slot}</td><td>${r.reg}</td><td><strong>${r.count}</strong></td></tr>`).join('')}</tbody></table></div>`:'<div class="small">尚未設定，前台會先顯示預設名額。</div>'; }
function renderLotteryPage(){ const venues=[...new Set(allRecords.map(r=>r.venue_type).filter(Boolean))]; const times=[...new Set(allRecords.map(r=>r.time_slot).filter(Boolean))]; document.getElementById('content').innerHTML=`<div class="panel"><h3>🎲 抽籤作業</h3><div class="alert">建議先選定「運動類型＋星期＋時段」後再抽籤，避免跨場次混抽。</div><div class="tools" style="grid-template-columns:repeat(5,1fr) auto"><select id="lotVenue"><option value="">全部類型</option>${venues.map(v=>`<option>${v}</option>`)}</select><select id="lotDay"><option value="">全部星期</option>${days.map(d=>`<option>${d}</option>`)}</select><select id="lotTime"><option value="">全部時段</option>${times.map(t=>`<option>${t}</option>`)}</select><input id="lotCount" type="number" min="1" value="1" placeholder="中籤人數"><button id="previewLot" class="btn btn-gray">預覽資料</button><button id="doLot" class="btn btn-orange">開始抽籤</button></div><div id="lotteryPreview"></div><div id="lotteryResult"></div></div>`; const refresh=()=>{ const records=allRecords.filter(r=>(!lotVenue.value||r.venue_type===lotVenue.value)&&(!lotDay.value||r.day_of_week===lotDay.value)&&(!lotTime.value||r.time_slot===lotTime.value)); document.getElementById('lotteryPreview').innerHTML=`<div class="msg info">符合抽籤條件資料：${records.length} 筆，${new Set(records.map(r=>r.phone)).size} 人</div>`; return records; }; ['lotVenue','lotDay','lotTime'].forEach(id=>document.getElementById(id).onchange=refresh); document.getElementById('previewLot').onclick=refresh; document.getElementById('doLot').onclick=()=>{ const rec=refresh(); const n=parseInt(document.getElementById('lotCount').value,10)||0; if(n<=0||rec.length===0){alert('請確認抽籤人數與篩選資料');return;} const winners=performLottery(rec,n); document.getElementById('lotteryResult').innerHTML=`<div class="panel" style="background:#fffaf0"><h3>🎉 抽籤結果（${winners.length} 筆）</h3>${winners.map((w,i)=>`<div class="account-row"><div><strong>${i+1}. ${escapeHtml(w.name)}</strong><div class="small">${escapeHtml(w.phone)}｜${escapeHtml(w.venue_type)}｜${escapeHtml(w.day_of_week)}｜${escapeHtml(w.time_slot)}｜#${escapeHtml(w.serial_number)}</div></div></div>`).join('')}</div>`; }; refresh(); }
function performLottery(records,winnerCount){ const groups={}; records.forEach(r=>{ const key=`${r.name}|${r.phone}|${r.day_of_week}|${r.venue_type}`; if(!groups[key]) groups[key]=[]; groups[key].push(r); }); const arr=Object.values(groups); const shuffled=[...arr].sort(()=>Math.random()-.5); return shuffled.slice(0,Math.min(winnerCount,arr.length)).flat(); }
function renderAccountsPage(){ if(currentAdmin.role!=='super_admin') return; document.getElementById('content').innerHTML=`<div class="two-col"><div class="panel"><h3>➕ 新增後台帳號</h3><div class="field"><label>帳號</label><input id="newUser" placeholder="例如 staff01"></div><div class="field"><label>顯示名稱</label><input id="newName" placeholder="例如 王小明"></div><div class="field"><label>密碼</label><input id="newPass" type="password"></div><div class="field"><label>角色</label><select id="newRole"><option value="staff">一般管理員</option><option value="super_admin">超級管理員</option></select></div><button id="addAccountBtn" class="btn btn-primary" style="width:100%">建立帳號</button><div class="small" style="margin-top:12px">一般管理員：可看資料、匯出、設定名額、抽籤。超級管理員：可管理帳號。</div></div><div class="panel"><h3>🔐 帳號安全說明</h3><div class="alert">帳號密碼採 SHA-256 加鹽雜湊儲存，不直接存明碼。但因目前是前端靜態網站，正式營運仍建議升級 Supabase Auth。</div></div></div><div class="panel"><h3>管理員清單</h3><div id="accountList">讀取中...</div></div>`; document.getElementById('addAccountBtn').onclick=async()=>{ const username=newUser.value.trim(), display_name=newName.value.trim(), password=newPass.value, role=newRole.value; if(!username||!display_name||!password){alert('請填完整');return;} try{ await createAdminAccount({username,display_name,password,role}); alert('帳號已建立'); renderAccountsPage(); }catch(e){ alert('建立失敗，可能帳號重複'); } }; loadAccountList(); }
async function loadAccountList(){ const admins=await loadAdmins(); if(!admins){document.getElementById('accountList').textContent='讀取失敗';return;} document.getElementById('accountList').innerHTML=admins.map(a=>`<div class="account-row"><div><strong>${escapeHtml(a.display_name)}｜${escapeHtml(a.username)}</strong><div class="small">${roleName(a.role)}｜${a.is_active?'啟用中':'已停用'}</div></div><div style="display:flex;gap:8px"><button class="btn btn-gray" data-reset="${a.id}">改密碼</button><button class="btn ${a.is_active?'btn-danger':'btn-green'}" data-toggle="${a.id}" data-active="${a.is_active}">${a.is_active?'停用':'啟用'}</button></div></div>`).join(''); document.querySelectorAll('[data-toggle]').forEach(btn=>btn.onclick=async()=>{ const active=btn.dataset.active==='true'; await db.from(ADMIN_TABLE).update({is_active:!active,updated_at:new Date().toISOString()}).eq('id',btn.dataset.toggle); loadAccountList(); }); document.querySelectorAll('[data-reset]').forEach(btn=>btn.onclick=()=>resetPassword(btn.dataset.reset)); }
function resetPassword(id){ showModal('重設密碼','請輸入新密碼：',async(input)=>{ if(!input){alert('請輸入密碼');return;} const salt=randomSalt(); const password_hash=await makeHash(input,salt); await db.from(ADMIN_TABLE).update({salt,password_hash,updated_at:new Date().toISOString()}).eq('id',id); alert('密碼已更新'); }, true); }
function exportToCsv(records){ if(!records.length){alert('沒有資料可以匯出');return;} let csv='序號,姓名,手機,地點,運動類型,星期,時段,登記時間\n'; records.forEach(r=>{ csv += `"${r.serial_number||''}","${r.name||''}","${r.phone||''}","${r.location_name||''}","${r.venue_type||''}","${r.day_of_week||''}","${r.time_slot||''}","${r.registered_at||''}"\n`; }); const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`登記清單_${new Date().toISOString().slice(0,10)}.csv`; a.click(); URL.revokeObjectURL(a.href); }
function showModal(title,body,onOk,withInput=false){ const el=document.createElement('div'); el.className='modal'; el.innerHTML=`<div class="modal-card"><h3>${title}</h3><div class="small">${body}</div>${withInput?'<input id="modalInput" type="password" style="width:100%;margin-top:12px;border:1px solid #d1d5db;border-radius:10px;padding:10px">':''}<div class="modal-actions"><button class="btn btn-gray" id="mCancel">取消</button><button class="btn btn-primary" id="mOk">確認</button></div></div>`; document.body.appendChild(el); document.getElementById('mCancel').onclick=()=>el.remove(); document.getElementById('mOk').onclick=async()=>{ const input=withInput?document.getElementById('modalInput').value:undefined; await onOk(input); el.remove(); }; }

document.getElementById('loginBtn').onclick=login; document.getElementById('createFirstAdminBtn').onclick=async()=>{ const username=firstUsername.value.trim(), display_name=firstDisplayName.value.trim(), password=firstPassword.value; if(!username||!display_name||!password){showMsg('loginMsg','請填完整第一個管理員資料');return;} try{ await createAdminAccount({username,display_name,password,role:'super_admin'}); showMsg('loginMsg','第一個管理員已建立，請登入。','ok'); document.getElementById('bootstrapBox').classList.add('hidden'); document.getElementById('loginBox').classList.remove('hidden'); }catch(e){ showMsg('loginMsg','建立失敗，請確認資料表與權限設定。'); } };
document.getElementById('logoutBtn').onclick=logout; document.querySelectorAll('.nav button').forEach(btn=>btn.onclick=()=>renderPage(btn.dataset.page));
(async function init(){ const saved=sessionStorage.getItem('venue_admin_session'); if(saved){ try{ currentAdmin=JSON.parse(saved); await enterApp(); return; }catch(e){} } await checkBootstrap(); })();
</script>
