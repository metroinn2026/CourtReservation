<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>北投會館運動場域智慧租借管理系統｜管理後台</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root{
      --blue:#007AB0;--blue2:#005A8C;--green:#40AF36;--orange:#FF9800;--red:#dc2626;
      --bg:#f3f6fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--border:#e5e7eb;--softBlue:#e5f2f7;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI','Noto Sans TC',Arial,sans-serif;}
    button,input,select{font-family:inherit}
    .hidden{display:none!important}
    .login-page{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr;background:linear-gradient(135deg,#e5f2f7 0%,#f8fafc 55%,#e0f7f0 100%)}
    .hero{padding:64px;display:flex;flex-direction:column;justify-content:center}
    .hero-badge{display:inline-block;width:max-content;background:#fff;border:1px solid #dbeafe;border-radius:999px;padding:8px 14px;color:var(--blue);font-weight:800;font-size:13px;margin-bottom:22px}
    .hero h1{font-size:46px;line-height:1.14;margin:0 0 16px;color:#0f172a}
    .hero p{font-size:17px;line-height:1.8;color:#475569;max-width:620px}
    .hero-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:28px;max-width:650px}
    .hero-card{background:rgba(255,255,255,.84);border:1px solid #dbeafe;border-radius:16px;padding:18px}
    .hero-card strong{display:block;font-size:24px;color:var(--blue);margin-bottom:5px}
    .hero-card span{font-size:13px;color:#64748b;font-weight:700}
    .login-wrap{display:flex;align-items:center;justify-content:center;padding:40px}
    .login-card{width:100%;max-width:440px;background:#fff;border:1px solid var(--border);border-radius:24px;padding:34px;box-shadow:0 24px 70px rgba(15,23,42,.12)}
    .login-card h2{margin:0 0 8px;font-size:26px;color:var(--blue)}
    .login-card p{margin:0 0 22px;color:var(--muted);line-height:1.7}
    .field{margin-bottom:16px}
    .field label{display:block;font-size:13px;color:#374151;font-weight:800;margin-bottom:7px}
    .field input,.field select,.toolbar input,.toolbar select,.inline-form input,.inline-form select{width:100%;border:1px solid #d1d5db;border-radius:10px;padding:10px 12px;font-size:14px;background:white}
    .field input:focus,.field select:focus,.toolbar input:focus,.toolbar select:focus,.inline-form input:focus,.inline-form select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,122,176,.12)}
    .btn{border:none;border-radius:10px;padding:10px 13px;font-size:14px;font-weight:850;cursor:pointer;transition:.15s;white-space:nowrap}
    .btn-primary,.btn-green,.btn-orange,.btn-danger,.btn-gray{background:var(--blue);color:#fff;border:1px solid var(--blue)}
    .btn-primary:hover,.btn-green:hover,.btn-orange:hover,.btn-danger:hover,.btn-gray:hover{background:var(--blue2);border-color:var(--blue2)}
    .btn:disabled{opacity:.55;cursor:not-allowed}
    .msg{padding:11px 12px;border-radius:10px;font-size:13px;margin:12px 0;line-height:1.6}.msg.error{background:#fee2e2;color:#7f1d1d}.msg.ok{background:#dcfce7;color:#166534}.msg.info{background:#e5f2f7;color:#075985}
    .app{min-height:100vh;display:grid;grid-template-columns:260px 1fr}
    .sidebar{background:#0f172a;color:#fff;padding:22px;display:flex;flex-direction:column;gap:18px}
    .brand{padding-bottom:18px;border-bottom:1px solid rgba(255,255,255,.12)}.brand h1{font-size:20px;line-height:1.35;margin:0 0 8px}.brand span{font-size:12px;color:#cbd5e1}
    .nav{display:flex;flex-direction:column;gap:8px}.nav button{width:100%;text-align:left;background:transparent;color:#cbd5e1;border:none;border-radius:12px;padding:12px 14px;font-weight:800;cursor:pointer}.nav button.active,.nav button:hover{background:rgba(255,255,255,.11);color:white}
    .side-footer{margin-top:auto;border-top:1px solid rgba(255,255,255,.12);padding-top:16px;font-size:12px;color:#cbd5e1}
    main.app-main{min-width:0}.topbar{height:74px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:10}.topbar h2{margin:0;color:#0f172a;font-size:22px}.userbox{display:flex;align-items:center;gap:12px}.avatar{width:38px;height:38px;border-radius:50%;background:var(--softBlue);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:900}
    .content{padding:28px;max-width:1600px}
    .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}.stat{background:#fff;border:1px solid var(--border);border-radius:18px;padding:18px;box-shadow:0 8px 24px rgba(15,23,42,.04)}.stat .label{font-size:12px;color:var(--muted);font-weight:800}.stat .num{font-size:30px;font-weight:900;margin-top:8px;color:var(--blue)}
    .panel{background:#fff;border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:18px;box-shadow:0 8px 24px rgba(15,23,42,.04)}.panel h3{margin:0 0 14px;font-size:17px;color:var(--blue)}
    
    .toolbar{display:grid;grid-template-columns:1.4fr repeat(4,1fr) auto;gap:10px;margin-bottom:14px;align-items:end}
    
    /* Unified backend tab style */
    .admin-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 16px;border-bottom:1px solid var(--border);padding:0 2px}
    .admin-tab{appearance:none;border:0;background:transparent;color:#64748b;font-weight:800;font-size:14px;padding:11px 18px;border-radius:10px 10px 0 0;cursor:pointer;border-bottom:3px solid transparent;transition:.15s ease}
    .admin-tab:hover{background:#f8fafc;color:var(--blue)}
    .admin-tab.active{background:#eaf6fb;color:var(--blue);border-bottom-color:var(--blue)}
    .admin-tabs.compact{margin:8px 0 14px}

    .records-function-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0;border-bottom:1px solid var(--border);padding:0 2px}
    .records-function-tab{appearance:none;border:0;background:transparent;color:#64748b;font-weight:800;font-size:14px;padding:11px 18px;border-radius:10px 10px 0 0;cursor:pointer;border-bottom:3px solid transparent}
    .records-function-tab:hover{background:#f8fafc;color:var(--blue)}
    .records-function-tab.active{background:#eaf6fb;color:var(--blue);border-bottom-color:var(--blue)}
    .records-function-panel{border:1px solid var(--border);border-top:0;border-radius:0 0 14px 14px;padding:14px;background:#fff;margin-bottom:14px}
    .records-function-panel.hidden{display:none!important}
    .records-action-title{font-size:13px;font-weight:900;color:#334155;margin-bottom:10px;display:flex;align-items:center;gap:7px}
    .records-action-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .records-action-row select{min-width:220px;max-width:290px;border:1px solid #d1d5db;border-radius:10px;padding:10px 12px;font-size:14px;background:#fff}
    .records-publish-main{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .records-publish-secondary{margin-left:auto;position:relative}
    .records-more-menu{position:absolute;right:0;top:44px;min-width:220px;background:white;border:1px solid var(--border);border-radius:12px;padding:8px;box-shadow:0 14px 34px rgba(15,23,42,.14);z-index:20}
    .records-more-menu button{display:block;width:100%;text-align:left;margin:4px 0}
    .section-note{font-size:12px;color:#64748b;margin-top:8px;line-height:1.6}
    .lottery-context{background:#f8fafc;border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:14px}
    .lottery-context-grid{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end}
    .lottery-step-title{font-size:16px;font-weight:900;color:#0f172a;margin:0 0 6px}
    .lottery-step-desc{font-size:13px;color:#64748b;line-height:1.6;margin-bottom:14px}
    .lottery-action-card{border:1px solid var(--border);border-radius:14px;padding:16px;background:#fff;margin-bottom:14px}
    .lottery-advanced{margin-top:16px;border-top:1px dashed var(--border);padding-top:14px}
    .lottery-advanced summary{cursor:pointer;font-weight:800;color:#64748b}


    .table-wrap{overflow:auto;border:1px solid var(--border);border-radius:12px}table{width:100%;border-collapse:collapse;background:white;font-size:13px;min-width:1000px}th{background:#f8fafc;text-align:left;color:#475569;font-size:12px;padding:11px;border-bottom:1px solid var(--border);white-space:nowrap}td{padding:11px;border-bottom:1px solid #f1f5f9;white-space:nowrap}tr:hover td{background:#f8fafc}
    .tag{display:inline-block;padding:4px 8px;border-radius:999px;font-weight:800;font-size:12px}.tag.blue{background:#e5f2f7;color:var(--blue)}.tag.warn{background:#fff7ed;color:#9a3412}.tag.green{background:#dcfce7;color:#166534}.tag.gray{background:#f3f4f6;color:#374151}
    .pager{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:13px;color:#475569}.pager-controls{display:flex;gap:8px;align-items:center}.inline-form{display:grid;grid-template-columns:repeat(5,1fr) auto;gap:10px;align-items:end}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px}.alert{border-left:4px solid var(--orange);background:#fff7ed;color:#9a3412;padding:12px;border-radius:10px;margin-bottom:14px;font-size:13px;line-height:1.6}
    .account-row{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px}.account-row strong{color:#0f172a}.small{font-size:12px;color:var(--muted);line-height:1.6}
    .modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:9999}.modal-card{background:#fff;border-radius:18px;padding:22px;max-width:430px;width:92%;box-shadow:0 24px 70px rgba(0,0,0,.2)}.modal-card h3{margin:0 0 10px;color:#0f172a}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
    @media(max-width:1100px){.login-page{grid-template-columns:1fr}.hero{display:none}.app{grid-template-columns:1fr}.sidebar{position:static}.nav{display:grid;grid-template-columns:repeat(3,1fr)}.cards{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr 1fr}.inline-form{grid-template-columns:1fr 1fr}.two-col{grid-template-columns:1fr}}
    @media(max-width:700px){.content{padding:16px}.cards{grid-template-columns:1fr}.nav{grid-template-columns:1fr}.topbar{padding:0 16px}.topbar h2{font-size:18px}}
  
  .records-compact-table{width:100%;table-layout:auto}
  .records-compact-table th,.records-compact-table td{white-space:nowrap;padding:9px 8px;font-size:12.5px;vertical-align:middle}
  .records-compact-table th{font-size:12px}
  .records-compact-table .tag{padding:3px 7px;font-size:12px;line-height:1.2}
  .records-compact-table .status-select-compact{min-width:104px;max-width:104px;font-size:13px}
  .records-compact-table .row-mini-btn{min-height:34px;padding:6px 10px;font-size:12px;border-radius:10px}
  .records-compact-table td:nth-child(6) strong{font-size:12.5px;letter-spacing:.1px}
  .records-compact-table td:nth-child(15), .records-compact-table th:nth-child(15){text-align:center}
  .records-compact-table td:nth-child(16), .records-compact-table th:nth-child(16){text-align:center}
  .records-table-wrap{overflow-x:auto}

  
  .lottery-advanced{margin:18px 20px 20px!important;border:1px dashed #cbd8e6!important;border-radius:16px!important;background:#fbfcfe!important;padding:12px 14px!important}
  .lottery-advanced summary{font-weight:800!important;color:#53657a!important;cursor:pointer!important}
  .lottery-advanced[open]{background:#f8fbff!important}

</style>

<style id="layered-admin-refresh">

    --blue:#0b78ad;
    --blue2:#075f8a;

  return venue==='籃球' ? 2 : 1;

  const duration=getVenueDurationHours(venue);
  const step=duration;
  const starts=[];
  for(let h=6; h+duration<=22; h+=step){
    starts.push(`${String(h).padStart(2,'0')}:00`);
  }
  return starts;
}
function formatTimeSlotDisplay(startTime, venue=''){
  const h=parseInt(String(startTime).split(':')[0],10);
  const duration=getVenueDurationHours(venue);
  const endHour=h+duration-1;
  return `${String(h).padStart(2,'0')}:00-${String(endHour).padStart(2,'0')}:59`;
}
function getRuleTimeSlots(venue=''){
  return getTimeOptionsForVenue(venue).map(st=>formatTimeSlotDisplay(st,venue));
}
function renderRuleTimeOptions(venue='',selected='',allLabel='全部時段',allowAll=true){
  const slots=getRuleTimeSlots(venue);
  const options=[];
  if(allowAll) options.push(`<option value="">${escapeHtml(allLabel)}</option>`);

  if(phone){
    const ids=new Set(records.filter(r=>normalizePhone(r.phone)===phone).map(r=>String(r.id_last4||'').trim()).filter(Boolean));
    if(ids.size>1) types.push('手機重複');
  }

  // 超過次數：合併「重複場次登記」與「超過申請上限」
  if(pk!=='|'){
    const sameStage=records.filter(r=>personKey(r)===pk && recordLocation(r)===recordLocation(record) && r.venue_type===record.venue_type && r.day_of_week===record.day_of_week && r.time_slot===record.time_slot);
    const sameSportSlots=new Set(records.filter(r=>personKey(r)===pk && recordLocation(r)===recordLocation(record) && r.venue_type===record.venue_type).map(r=>`${r.day_of_week||''}|${r.time_slot||''}`));
    const exceedsRule = sameStage.length>1 || (['羽球','籃球'].includes(record.venue_type) && sameSportSlots.size>1);
    if(exceedsRule) types.push('超過次數');
  }

  const stage=records.filter(r=>recordLocation(r)===recordLocation(record) && r.venue_type===record.venue_type && r.day_of_week===record.day_of_week && r.time_slot===record.time_slot);
  if(stage.length){
    const start=getStageStartTime(record.time_slot);
    const cap=Number(capacitySettings[settingKey(record.venue_type,record.day_of_week,start)] ?? capacityMap[record.venue_type] ?? 0);
    const winners=stage.filter(x=>x.lottery_status==='中籤').length;
    if(cap>=0 && winners>cap) types.push('超過名額');

    const published=stage.filter(x=>x.result_published).length;
    const noResult=stage.filter(x=>!String(x.lottery_status||'').trim()).length;
    if(published>0 && noResult>0) types.push('公布未完成');

    const nums=stage.map(x=>String(x.lottery_status||'').match(/^候補(\d+)$/)).filter(Boolean).map(m=>Number(m[1])).sort((a,b)=>a-b);
    if(nums.length){
      const dup=nums.some((n,i)=>i>0 && n===nums[i-1]);
      const gap=nums.some((n,i)=>n!==i+1);
      if(dup||gap) types.push('候補異常');
    }
  }
  return [...new Set(types)];
}
function anomalyTags(record){
  const types=getRecordAnomalyTypes(record);
  if(!types.length) return '<span class="tag gray">正常</span>';
  return types.map(t=>`<span class="tag anomaly-red">${escapeHtml(t)}</span>`).join('');
}

function getStageStartTime(timeSlot){
  const m=String(timeSlot||'').match(/(\d{2}:\d{2})/);
  return m ? m[1] : String(timeSlot||'');
}
function personKey(r){ return `${normalizePhone(r.phone)}|${String(r.id_last4||'').trim()}`; }
function buildDataAnomalies(){
  const issues=[];
  const records=allRecords||[];

  // 1. 手機重複
  const phoneGroups={};
  records.forEach(r=>{
    const phone=normalizePhone(r.phone); if(!phone) return;
    if(!phoneGroups[phone]) phoneGroups[phone]=[];
    phoneGroups[phone].push(r);
  });
  Object.entries(phoneGroups).forEach(([phone,rows])=>{
    const ids=[...new Set(rows.map(r=>String(r.id_last4||'').trim()).filter(Boolean))];
    if(ids.length>1) issues.push({
      type:'手機重複', severity:'warn', count:rows.length,
      detail:`${phone}｜${ids.length}組身分`,
      target:'records'
    });
  });

  // 2. 超過次數：合併重複場次與超過申請上限
  const personSportGroups={};
  records.forEach(r=>{
    const pk=personKey(r); if(pk==='|') return;
    const k=`${pk}|${recordLocation(r)}|${r.venue_type||''}`;
    if(!personSportGroups[k]) personSportGroups[k]=[];
    personSportGroups[k].push(r);
  });
  Object.values(personSportGroups).forEach(rows=>{
    const r=rows[0];
    const stageCounts={};
    rows.forEach(x=>{
      const k=`${x.day_of_week||''}|${x.time_slot||''}`;
      stageCounts[k]=(stageCounts[k]||0)+1;
    });
    const hasDuplicateStage=Object.values(stageCounts).some(n=>n>1);
    const distinctSlots=Object.keys(stageCounts).length;
    const overSportLimit=['羽球','籃球'].includes(r.venue_type) && distinctSlots>1;
    if(hasDuplicateStage || overSportLimit) issues.push({
      type:'超過次數', severity:'error', count:rows.length,
      detail:`${r.name||'申請人'}｜${r.venue_type||'-'}｜${rows.length}筆`,
      target:'records'
    });
  });

  // 3. 場次層級檢核
  const stageGroups={};
  records.forEach(r=>{
    const k=`${recordLocation(r)}|${r.venue_type||''}|${r.day_of_week||''}|${r.time_slot||''}`;
    if(!stageGroups[k]) stageGroups[k]=[];
    stageGroups[k].push(r);
  });
  Object.values(stageGroups).forEach(rows=>{
    const r=rows[0];
    const stageLabel=`${locationLabel(recordLocation(r))}｜${r.venue_type||'-'}｜${r.day_of_week||'-'}｜${r.time_slot||'-'}`;
    const winners=rows.filter(x=>x.lottery_status==='中籤').length;
    const start=getStageStartTime(r.time_slot);
    const cap=Number(capacitySettings[settingKey(r.venue_type,r.day_of_week,start)] ?? capacityMap[r.venue_type] ?? 0);
    if(cap>=0 && winners>cap) issues.push({
      type:'超過名額', severity:'error', count:winners-cap,
      detail:`${stageLabel}｜中籤${winners}/${cap}`,
      target:'lottery'
    });

    const published=rows.filter(x=>x.result_published).length;
    const noResult=rows.filter(x=>!String(x.lottery_status||'').trim()).length;
    if(published>0 && noResult>0) issues.push({
      type:'公布未完成', severity:'error', count:noResult,
      detail:`${stageLabel}｜${noResult}筆未完成`,
      target:'records'
    });

    const nums=rows.map(x=>String(x.lottery_status||'').match(/^候補(\d+)$/)).filter(Boolean).map(m=>Number(m[1])).sort((a,b)=>a-b);
    if(nums.length){
      const dup=nums.some((n,i)=>i>0 && n===nums[i-1]);
      const gap=nums.some((n,i)=>n!==i+1);
      if(dup||gap) issues.push({
        type:'候補異常', severity:'warn', count:nums.length,
        detail:`${stageLabel}｜順位需確認`,
        target:'lottery'
      });
    }
  });
  return issues;
}
function renderAnomalyCenter(issues){
  if(!issues.length){
    return `
      <div class="panel anomaly-center-clean flat-section" id="anomalyCenter">
        <div class="anomaly-center-head"><h3>異常檢核中心</h3></div>
        <div class="anomaly-info-row">
          <div class="small">系統自動檢查可能需要人工確認的資料，僅提醒，不會自動修改。</div>
          <div class="anomaly-total-line">0 項待確認</div>
        </div>
        <div class="flat-empty">目前未發現需人工確認的資料異常。</div>
      </div>`;
  }

  const grouped={};
  issues.forEach(x=>{
    if(!grouped[x.type]) grouped[x.type]=[];
    grouped[x.type].push(x);
  });

  const rows=Object.entries(grouped).map(([type,list])=>{
    const total=list.reduce((s,x)=>s+(x.count||1),0);
    const examples=list.slice(0,2).map(x=>escapeHtml(x.detail)).join('<br>');
    const more=list.length>2 ? `<div class="anomaly-more">另有 ${list.length-2} 項</div>` : '';
    return `
      <div class="anomaly-flat-row">
        <div class="anomaly-flat-type">${escapeHtml(type)}</div>
        <div class="anomaly-flat-count">${list.length} 項 / ${total} 筆</div>
        <div class="anomaly-flat-detail">${examples}${more}</div>
        <button class="anomaly-text-action" data-target="records" data-anomaly="${escapeHtml(type)}">查看</button>
      </div>`;
  }).join('');

  return `
    <div class="panel anomaly-center-clean flat-section" id="anomalyCenter">
      <div class="anomaly-center-head"><h3>異常檢核中心</h3></div>
      <div class="anomaly-info-row">
        <div class="small">系統自動檢查可能需要人工確認的資料，僅提醒，不會自動修改。</div>
        <div class="anomaly-total-line">${issues.length} 項待確認</div>
      </div>
      <div class="anomaly-flat-list">${rows}</div>
    </div>`;
}

async function sha256(text){ const enc=new TextEncoder(); const buf=await crypto.subtle.digest('SHA-256', enc.encode(text)); return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join(''); }
function randomSalt(){ return crypto.getRandomValues(new Uint8Array(16)).reduce((s,b)=>s+b.toString(16).padStart(2,'0'),''); }
async function makeHash(password, salt){ return sha256(`${salt}:${password}`); }

}

  const {error}=await db.from(ADMIN_TABLE).insert([payload]);
  if(error) throw error;

    waitlist_template: '{name}您好，您登記的{venue}場地「{day} {time}」目前為{status}，若有名額釋出將依序通知。',
    loser_template: '{name}您好，您登記的{venue}場地「{day} {time}」本次未中籤，感謝您的登記。'
  };

  if(!settingsRes.error){
    (settingsRes.data||[]).forEach(row=>{
      systemSettings[row.key]=row.value || '';
    });
  }else{
    console.warn('讀取文字設定失敗，請確認 system_settings 資料表與權限。', settingsRes.error);
  }
}

function stats(records=allRecords){
  const total=records.length;
  const people=new Set(records.map(r=>`${normalizePhone(r.phone)}|${r.id_last4||''}`)).size;
  const hours=records.reduce((s,r)=>s+recordHours(r),0);
  const byVenue={};
  records.forEach(r=>{ const v=r.venue_type||'未分類'; if(!byVenue[v]) byVenue[v]={count:0,people:new Set(),hours:0}; byVenue[v].count++; byVenue[v].people.add(`${normalizePhone(r.phone)}|${r.id_last4||''}`); byVenue[v].hours+=recordHours(r); });
  Object.keys(byVenue).forEach(v=>byVenue[v].people=byVenue[v].people.size);
  return {total,people,hours,byVenue};
}

          if(ven) ven.value=venue;
          if(d) d.value=day;
          if(t) t.value=time;
          const filterBtn=document.getElementById('refreshLotteryContext');
          if(filterBtn) filterBtn.click();
        },0);
      }else{
        recordState.location=location;
        recordState.venue=venue;
        recordState.day=day;
        recordState.time=time;
        recordState.q='';
        recordState.anomaly='';
        recordState.page=1;
        recordsActionTab='publish';
        renderPage('records');
      }
    };
  });
}

function daySortValue(day){
  const order={'周一':1,'周二':2,'周三':3,'周四':4,'周五':5,'周六':6,'周日':7};
  return order[day] || 99;
}
function timeSortValue(timeSlot){
  const t=String(timeSlot||'').split('-')[0];
  const h=parseInt(t.split(':')[0],10);
  return isNaN(h) ? 99 : h;
}
function statusSortValue(status){
  const s=String(status||'未抽籤');
  if(s==='中籤') return 1;
  if(s.startsWith('候補')) return 2 + (parseInt(s.replace('候補',''),10)||0);
  if(s==='未中籤') return 50;
  return 99;
}
function venueSortValue(venue){
  const order={'羽球':1,'籃球':2,'B1桌球':3,'B2桌球':4};
  return order[venue] || 99;
}
function getSortValue(record,key){
  if(key==='lottery_status') return statusSortValue(record.lottery_status);
  if(key==='venue_type') return venueSortValue(record.venue_type);
  if(key==='day_of_week') return daySortValue(record.day_of_week);
  if(key==='time_slot') return timeSortValue(record.time_slot);
  if(key==='registered_at') return record.registered_at ? new Date(record.registered_at).getTime() : 0;
  return String(record[key] || '').toLowerCase();
}
function sortRecords(records){
  const key=recordState.sortKey || 'registered_at';
  const dir=recordState.sortDir || 'desc';
  return [...records].sort((a,b)=>{
    const av=getSortValue(a,key);
    const bv=getSortValue(b,key);
    let cmp=0;
    if(typeof av==='number' && typeof bv==='number') cmp=av-bv;
    else cmp=String(av).localeCompare(String(bv),'zh-Hant');
    return dir==='asc' ? cmp : -cmp;
  });
}
function sortHeader(label,key){
  const active = recordState.sortKey === key;
  const arrow = active
    ? (recordState.sortDir === 'asc' ? '▲' : '▼')
    : '▲▼';

  return `
    <button
      class="sort-head"
      data-sort="${key}"
      style="
        background:none;
        border:none;
        cursor:pointer;
        font-weight:800;
        color:${active ? '#0f172a' : '#64748b'};
        display:flex;
        align-items:center;
        gap:4px;
        font-size:13px;
        padding:0;
      ">
      <span>${label}</span>
      <span style="
        font-size:11px;
        color:${active ? '#2563eb' : '#94a3b8'};
        letter-spacing:-1px;
      ">${arrow}</span>
    </button>
  `;
}
function bindSortHeaders(){
  document.querySelectorAll('[data-sort]').forEach(btn=>{
    btn.onclick=()=>{
      const key=btn.dataset.sort;
      if(recordState.sortKey===key){
        recordState.sortDir = recordState.sortDir==='asc' ? 'desc' : 'asc';
      }else{
        recordState.sortKey=key;
        recordState.sortDir = key==='registered_at' ? 'desc' : 'asc';
      }
      recordState.page=1;
      renderRecordsTable();
    };
  });
}

function getFilteredRecords(){
  const q=recordState.q.trim().toLowerCase();
  const filteredRecords = allRecords.filter(r=>{
    if(recordState.location && recordLocation(r)!==recordState.location) return false;
    if(recordState.venue && r.venue_type!==recordState.venue) return false;
    if(recordState.day && r.day_of_week!==recordState.day) return false;
    if(recordState.time && r.time_slot!==recordState.time) return false;
    const anomalyTypes=getRecordAnomalyTypes(r);
    if(recordState.anomaly==='__normal__' && anomalyTypes.length>0) return false;
    if(recordState.anomaly && recordState.anomaly!=='__normal__' && !anomalyTypes.includes(recordState.anomaly)) return false;
    if(q){
      const hay=`${r.name||''} ${r.phone||''} ${r.id_last4||''} ${r.serial_number||''} ${recordLocation(r)} ${r.venue_type||''} ${r.day_of_week||''} ${r.time_slot||''}`.toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  return sortRecords(filteredRecords);
}

async function publishCurrentFilteredRange(published){
  const records=getFilteredRecords();
  if(!records.length){
    alert('目前篩選範圍沒有資料。');
    return;
  }
  if(published && !recordState.venue){
    alert('為避免誤公告，請至少選擇「球類」後再公布。');
    return;
  }
  const noResult=records.filter(r=>!String(r.lottery_status||'').trim()).length;
  if(published && noResult>0){
    alert(`目前範圍仍有 ${noResult} 筆未設定抽籤結果，請先完成結果處理。`);
    return;
  }

  const scope=currentRecordsScopeLabel();
  const okConfirm=await confirmPublishRecords(records,published,scope);
  if(!okConfirm) return;

  const ok=await publishRecords(records.map(r=>r.id), published, {
    scope:'目前篩選範圍',
    venue:recordState.venue || '',
    day:recordState.day || '',
    time:recordState.time || '',
    location:recordState.location || ''
  });
  if(ok){
    await loadAllData();
    renderRecordsPage();
  }
}

function shortLocationName(value){
  const text=String(value||'').trim();
  if(!text) return '';
  if(text==='北投會館') return '北投';
  if(text.endsWith('會館')) return text.replace(/會館$/,'');
  return text;
}
function formatCompactDateTime(value){
  if(!value) return '';
  const d=new Date(value);
  if(Number.isNaN(d.getTime())) return '';
  const mm=String(d.getMonth()+1).padStart(2,'0');
  const dd=String(d.getDate()).padStart(2,'0');
  const hh=String(d.getHours()).padStart(2,'0');
  const mi=String(d.getMinutes()).padStart(2,'0');
  return `${mm}/${dd} ${hh}:${mi}`;
}
function recordStatusTag(status){
  const s=String(status||'').trim();
  if(!s) return '<span class="tag gray">未抽籤</span>';
  if(s==='中籤') return '<span class="tag green">中籤</span>';
  if(s.startsWith('候補')) return `<span class="tag warn">${escapeHtml(s)}</span>`;
  if(s==='未中籤') return '<span class="tag gray">未中籤</span>';
  return `<span class="tag gray">${escapeHtml(s)}</span>`;
}

function recordStatusSelect(record){
  const current = pendingRecordStatusChanges.has(String(record.id))
    ? pendingRecordStatusChanges.get(String(record.id))
    : String(record.lottery_status||'');
  const disabled = record.result_published ? 'disabled title="已公布資料請先取消公布後再修改"' : '';
  return `<select class="record-status-select" data-status-id="${record.id}" data-original="${escapeHtml(String(record.lottery_status||''))}" ${disabled}>
    <option value="" ${current===''?'selected':''}>未抽籤</option>

function stageSelectedRecordStatus(){
  const ids=[...selectedRecordIds].map(String);
  if(ids.length===0){ alert('請先勾選要變更狀態的資料'); return; }

  const select=document.getElementById('listBatchStatus');
  const status=select?.value ?? '';
  if(status==='__none__' || !select){ alert('請先選擇要套用的抽籤狀態'); return; }

  const selectedRecords=allRecords.filter(r=>ids.includes(String(r.id)));
  const published=selectedRecords.filter(r=>r.result_published);
  if(published.length){
    alert(`已勾選資料中有 ${published.length} 筆已公布，請先取消公布後再修改狀態。`);
    return;
  }

  ids.forEach(id=>{
    const record=allRecords.find(r=>String(r.id)===id);
    if(!record) return;
    const original=String(record.lottery_status||'');
    const next=status==='__clear__' ? '' : status;
    if(next===original) pendingRecordStatusChanges.delete(id);
    else pendingRecordStatusChanges.set(id,next);
  });

  if(select) select.value='__none__';
  renderRecordsTable();
}

async function savePendingRecordStatusChanges(){
  const changes=[...pendingRecordStatusChanges.entries()];
  if(changes.length===0){ alert('目前沒有尚未儲存的狀態變更'); return; }

  const changedRecords=changes.map(([id,status])=>({
    id,
    status,
    record:allRecords.find(r=>String(r.id)===String(id))
  })).filter(x=>x.record);

  const published=changedRecords.filter(x=>x.record.result_published);
  if(published.length){
    alert(`其中有 ${published.length} 筆資料已公布，請先取消公布後再修改狀態。`);
    return;
  }

  showModal('確認儲存狀態變更',`確定一次儲存 ${changedRecords.length} 筆抽籤狀態變更嗎？`,async()=>{
    let updated=0;
    for(const item of changedRecords){
      const payload={
        lottery_status:item.status || null,
        lottery_locked:!!item.status,
        updated_at:new Date().toISOString()
      };
      if(!item.status){
        payload.lottery_batch=null;
        payload.result_published=false;
      }

      const {error}=await db.from(RECORD_TABLE).update(payload).eq('id',item.id);
      if(error){
        console.error(error);
        alert(`儲存失敗：${item.record?.name||item.id}`);
        return;
      }
      updated++;
    }

    await writeOperationLog('批次儲存個別抽籤狀態', {
      total:updated,
      changes:changedRecords.map(x=>({
        id:x.id,
        serial_number:x.record?.serial_number||'',
        before_status:x.record?.lottery_status||'未抽籤',
        after_status:x.status||'未抽籤'
      }))
    }, changedRecords.map(x=>x.id));

    pendingRecordStatusChanges.clear();
    await loadAllData();
    renderRecordsPage();
    alert(`已儲存 ${updated} 筆狀態變更。`);
  });
}

async function batchUpdateSelectedLotteryStatus(){
  const ids=[...selectedRecordIds];
  if(ids.length===0){ alert('請先勾選要變更抽籤狀態的資料'); return; }

  const select=document.getElementById('batchLotteryStatus');
  const rawValue=select ? select.value : '';
  if(!rawValue){ alert('請先選擇要統一變更的抽籤狀態'); return; }

  const status=rawValue==='__clear__' ? '' : rawValue;
  const selectedRecords=allRecords.filter(r=>ids.some(id=>String(id)===String(r.id)));
  const publishedRecords=selectedRecords.filter(r=>r.result_published);
  if(publishedRecords.length>0){
    alert(`勾選資料中有 ${publishedRecords.length} 筆已公布結果。為避免前台結果被直接變更，請先取消公布後再批次修改。`);
    return;
  }

  const displayStatus=status || '未抽籤';
  showModal('確認儲存批次變更',`確定要將已勾選的 ${ids.length} 筆資料，統一變更為「${escapeHtml(displayStatus)}」嗎？`,async()=>{
    const payload={
      lottery_status: status || null,
      lottery_locked: !!status,
      updated_at: new Date().toISOString()
    };
    if(!status){
      payload.lottery_batch=null;
      payload.result_published=false;
    }

    const {error,data}=await db.from(RECORD_TABLE).update(payload).in('id',ids).select('id');
    if(error){
      console.error(error);
      alert('批次變更抽籤狀態失敗');
      return;
    }

    const updatedCount=Array.isArray(data) ? data.length : ids.length;
    await writeOperationLog('批次變更抽籤狀態', {
      total: updatedCount,
      after_status: displayStatus,
      serial_numbers: selectedRecords.map(r=>r.serial_number).filter(Boolean)
    }, ids);

    selectedRecordIds.clear();
    if(select) select.value='';
    await loadAllData();
    renderRecordsPage();
    alert(`已儲存 ${updatedCount} 筆資料，狀態統一變更為「${displayStatus}」。`);
  });
}

async function updateRecordLotteryStatus(recordId, status){
  const payload={
    lottery_status: status || null,
    updated_at: new Date().toISOString()
  };

  if(!status){
    payload.lottery_locked=false;
    payload.lottery_batch=null;
    payload.result_published=false;
  }else{
    payload.lottery_locked=true;
  }

  const before=allRecords.find(r=>String(r.id)===String(recordId));
  const {error}=await db.from(RECORD_TABLE).update(payload).eq('id',recordId);
  if(error){
    console.error(error);
    alert('更新抽籤狀態失敗');
    return false;
  }
  await writeOperationLog('變更抽籤狀態', {
    record_id: recordId,
    name: before?.name || '',
    phone: before?.phone || '',
    venue_type: before?.venue_type || '',
    day_of_week: before?.day_of_week || '',
    time_slot: before?.time_slot || '',
    before_status: before?.lottery_status || '未抽籤',
    after_status: status || '未抽籤'
  }, [recordId]);
  return true;
}

async function publishRecords(recordIds, published, meta={}){
  if(!recordIds || recordIds.length===0){
    alert('沒有可更新的資料');
    return false;
  }

  const publishPayload={result_published:published, updated_at:new Date().toISOString(), published_at: published ? new Date().toISOString() : null};
  let {error,data}=await db
    .from(RECORD_TABLE)
    .update(publishPayload)
    .in('id',recordIds)
    .select('id');

  if(error && String(error.message||'').includes('published_at')){
    console.warn('published_at 欄位尚未建立，改用無公布時間模式更新。', error);
    const fallback=await db
      .from(RECORD_TABLE)
      .update({result_published:published, updated_at:new Date().toISOString()})
      .in('id',recordIds)
      .select('id');
    error=fallback.error;
    data=fallback.data;
  }

  if(error){
    console.error(error);
    alert('更新公布狀態失敗，請確認 result_published 欄位與 UPDATE 權限。');
    return false;
  }

  await writeOperationLog(published ? '公布抽籤結果' : '取消公布抽籤結果', {
    scope: meta.scope || '',
    venue_type: meta.venue || '',
    day_of_week: meta.day || '',
    time_slot: meta.time || '',
    total: (data||[]).length,
    summary: buildPublishSummary(recordIds.map(id=>allRecords.find(r=>String(r.id)===String(id))).filter(Boolean))
  }, recordIds);

  alert(`${published?'已公布':'已取消公布'}，共更新 ${(data||[]).length} 筆`);
  return true;
}

function buildPublishSummary(records){
  const counts={total:records.length,winner:0,waitlist:0,loser:0,noResult:0,published:0};
  records.forEach(r=>{
    const s=String(r.lottery_status||'');
    if(s==='中籤') counts.winner++;
    else if(s.startsWith('候補')) counts.waitlist++;
    else if(s==='未中籤') counts.loser++;
    else counts.noResult++;
    if(r.result_published) counts.published++;
  });
  return counts;
}

    .replace(/\{id_last4\}/g, data.id_last4 || '')

  async function parseLotteryResultFile(file){
    if(typeof XLSX==='undefined') throw new Error('Excel 讀取元件尚未載入，請重新整理頁面後再試。');
    const buffer=await file.arrayBuffer();
    const workbook=XLSX.read(buffer,{type:'array'});
    const sheet=workbook.Sheets[workbook.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(sheet,{defval:'',raw:false});
    if(!rows.length) throw new Error('檔案內沒有可讀取的資料。');

    const findValue=(row,names)=>{
      for(const n of names){
        if(Object.prototype.hasOwnProperty.call(row,n)) return row[n];
      }
      return '';
    };
    const normalizeStatus=(value)=>{
      let v=String(value??'').trim().replace(/\s+/g,'');
      if(!v || v==='未抽籤') return '';
      if(v==='正取' || v==='中選' || v==='中籤') return '中籤';
      if(v==='落選' || v==='未中選' || v==='未中籤') return '未中籤';
      const m=v.match(/^(?:候補|備取)(\d+)$/);
      if(m) return `候補${Number(m[1])}`;
      return null;
    };

    const {venue,day,records}=getDayCheckRecords();
    const recordMap=new Map(records.map(r=>[String(r.serial_number||'').trim(),r]));
    const seen=new Set();
    const valid=[];
    const errors=[];
    const skipped=[];

    rows.forEach((row,idx)=>{
      const serial=String(findValue(row,['序號','登記序號','serial_number','Serial Number'])??'').trim();
      const rawStatus=findValue(row,['抽籤狀態','抽籤結果','結果','lottery_status','Lottery Status']);
      const status=normalizeStatus(rawStatus);
      const excelRow=idx+2;
      if(!serial && !String(rawStatus??'').trim()) return;
      if(!serial){ errors.push({row:excelRow,serial:'',status:String(rawStatus??''),reason:'缺少序號'}); return; }
      if(seen.has(serial)){ errors.push({row:excelRow,serial,status:String(rawStatus??''),reason:'序號重複'}); return; }
      seen.add(serial);
      const record=recordMap.get(serial);
      if(!record){ errors.push({row:excelRow,serial,status:String(rawStatus??''),reason:`找不到目前「${venue}｜${day}」的登記資料`}); return; }
      if(status===null){ errors.push({row:excelRow,serial,status:String(rawStatus??''),reason:'抽籤狀態格式不符'}); return; }
      if(!status){ skipped.push({row:excelRow,serial,name:record.name,reason:'抽籤狀態空白'}); return; }
      if(record.result_published){ errors.push({row:excelRow,serial,status,reason:'此筆結果已公布，請先取消公布'}); return; }
      if(record.lottery_locked || String(record.lottery_status||'').trim()){
        errors.push({row:excelRow,serial,status,reason:'此筆已有抽籤結果或已鎖定，請先解除鎖定'}); return;
      }
      valid.push({row:excelRow,serial,status,record});
    });

    if(valid.length===0 && errors.length===0) throw new Error('未找到可匯入的抽籤結果。請確認欄位包含「序號」及「抽籤狀態」。');
    return {valid,errors,skipped,venue,day,totalRows:rows.length};
  }

    const errorRows=parsed.errors.slice(0,8).map(x=>`<tr><td>${x.row}</td><td>${escapeHtml(x.serial)}</td><td>${escapeHtml(x.status)}</td><td style="color:#b91c1c;font-weight:800;">${escapeHtml(x.reason)}</td></tr>`).join('');
    box.innerHTML=`

          <div>

            <div class="small">${escapeHtml(fileName)}｜${escapeHtml(parsed.venue)}｜${escapeHtml(parsed.day)}</div>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button id="cancelLotteryImportBtn" class="btn btn-gray">取消</button>
            <button id="confirmLotteryImportBtn" class="btn btn-primary" ${parsed.valid.length===0 || parsed.errors.length>0 ? 'disabled' : ''}>確認匯入並鎖定</button>

        </div>
        <div class="cards" style="margin-bottom:12px;">
          <div class="stat"><div class="label">可匯入</div><div class="num">${parsed.valid.length}</div></div>
          <div class="stat"><div class="label">中籤</div><div class="num" style="color:#16a34a">${counts.winner}</div></div>
          <div class="stat"><div class="label">候補</div><div class="num" style="color:#d97706">${counts.wait}</div></div>
          <div class="stat"><div class="label">未中籤</div><div class="num" style="color:#64748b">${counts.lose}</div></div>
        </div>
        ${parsed.errors.length ? `<div class="msg error"><strong>有 ${parsed.errors.length} 筆需要修正，為避免誤匯入，目前暫不開放確認。</strong><br>請修正 Excel 後重新上傳。</div><div class="table-wrap" style="margin-bottom:12px;"><table style="min-width:650px"><thead><tr><th>Excel列</th><th>序號</th><th>抽籤狀態</th><th>原因</th></tr></thead><tbody>${errorRows}</tbody></table></div>${parsed.errors.length>8?`<div class="small">另有 ${parsed.errors.length-8} 筆錯誤未顯示。</div>`:''}` : '<div class="msg ok">格式檢查完成，可確認匯入。匯入後結果會先鎖定且維持「未公布」，請確認無誤後再執行公布。</div>'}
        ${parsed.skipped.length ? `<div class="small">另有 ${parsed.skipped.length} 筆因「抽籤狀態空白」而略過，不會更新。</div>` : ''}
      </div>`;
    document.getElementById('cancelLotteryImportBtn').onclick=()=>{ box.innerHTML=''; window.pendingLotteryImport=null; };
    const confirmBtn=document.getElementById('confirmLotteryImportBtn');
    if(confirmBtn) confirmBtn.onclick=()=>confirmLotteryImport(parsed);
  }

  async function confirmLotteryImport(parsed){
    if(!parsed || parsed.valid.length===0 || parsed.errors.length>0) return;
    const ok=await confirmModal('確認匯入抽籤結果',`確定匯入 <strong>${parsed.valid.length}</strong> 筆抽籤結果並鎖定嗎？<br><br>${escapeHtml(parsed.venue)}｜${escapeHtml(parsed.day)}<br><br>匯入後仍為「未公布」，需另行確認後才會顯示於民眾前台。`);
    if(!ok) return;
    const btn=document.getElementById('confirmLotteryImportBtn');
    if(btn){ btn.disabled=true; btn.textContent='匯入中...'; }
    const batchId=`excel-${Date.now()}`;
    const successIds=[];
    const failed=[];
    const items=parsed.valid;
    for(let i=0;i<items.length;i+=15){
      const chunk=items.slice(i,i+15);
      const results=await Promise.all(chunk.map(async item=>{
        const {error,data}=await db.from(RECORD_TABLE).update({
          lottery_status:item.status,
          lottery_locked:true,
          lottery_batch:batchId,
          result_published:false,
          updated_at:new Date().toISOString()
        }).eq('id',item.record.id).select('id');
        const noUpdate=!error && (!data || data.length===0);
        return {item,error:noUpdate ? new Error('資料未更新，請確認權限或資料狀態') : error};
      }));
      results.forEach(({item,error})=>{
        if(error) failed.push({serial:item.serial,error});
        else successIds.push(item.record.id);
      });
    }
    await writeOperationLog('匯入 Excel 抽籤結果', {
      venue_type:parsed.venue,
      day_of_week:parsed.day,
      imported_count:successIds.length,
      failed_count:failed.length,
      batch_id:batchId
    }, successIds);
    if(failed.length){
      alert(`已匯入 ${successIds.length} 筆，另有 ${failed.length} 筆更新失敗。請重新整理後確認。`);
    }else{
      alert(`已匯入並鎖定 ${successIds.length} 筆抽籤結果。結果尚未公布，請確認後再執行公布。`);
    }
    const venue=parsed.venue, day=parsed.day;
    await loadAllData();
    renderLotteryPage();
    setTimeout(()=>{
      const v=document.getElementById('dayCheckVenue');
      const d=document.getElementById('dayCheckDay');
      if(v){
        v.value=venue;
        refreshRuleTimeSelect('dayCheckTime',venue,'');
      }
      if(d) d.value=day;
      if(d) d.dispatchEvent(new Event('change'));
      renderDayCheck();
      renderImportSummary();
    },0);
  }


  function getDayCheckRecords(){
    const location=document.getElementById('dayCheckLocation')?.value || DEFAULT_LOCATION;
    const venue=document.getElementById('dayCheckVenue')?.value || '';
    const day=document.getElementById('dayCheckDay')?.value || '';
    const time=document.getElementById('dayCheckTime')?.value || '';
    const records=allRecords.filter(r=>{
      if(location && recordLocation(r)!==location) return false;
      if(venue && r.venue_type!==venue) return false;
      if(day && r.day_of_week!==day) return false;
      if(time && r.time_slot!==time) return false;
      return true;
    });
    return {location,venue,day,time,records};
  }

  function renderDayCheck(){
    const table=document.getElementById('dayCheckTable');
    if(!table) return;

    const {location,venue,day,time,records}=getDayCheckRecords();

    if(!records.length){
      table.innerHTML='<div class="msg info">目前條件沒有登記資料；可調整場地、球類、星期或時段後再試。</div>';
      return;
    }

    // 以「場地＋球類＋星期＋時段」視為一個完整抽籤場次
    const stageMap={};
    records.forEach(r=>{
      const loc=recordLocation(r);
      const key=`${loc}|${r.venue_type||''}|${r.day_of_week||''}|${r.time_slot||''}`;
      if(!stageMap[key]){
        stageMap[key]={
          location:loc,
          venue:r.venue_type||'',
          day:r.day_of_week||'',
          time:r.time_slot||'',
          records:[]
        };
      }
      stageMap[key].records.push(r);
    });

    const stages=Object.values(stageMap).map(s=>{
      const people=new Set(s.records.map(r=>`${normalizePhone(r.phone)}|${r.id_last4||''}`)).size;
      const withResult=s.records.filter(r=>String(r.lottery_status||'').trim()).length;
      const published=s.records.filter(r=>r.result_published).length;
      const configuredCapacity=Number(
        capacitySettings[settingKey(s.venue,s.day,s.time)] ??
        capacityMap[s.venue] ??
        0
      );
      const anomalyTypes=[...new Set(s.records.flatMap(r=>getRecordAnomalyTypes(r)))];

      let status='待抽籤';
      if(withResult>0 && withResult<s.records.length) status='處理中';
      if(withResult===s.records.length && withResult>0){
        status=published===s.records.length ? '已公布' : '已完成';
      }

      return {
        ...s,
        people,
        capacity:configuredCapacity,
        anomalyTypes,
        status
      };
    }).sort((a,b)=>{
      const locCmp=String(a.location).localeCompare(String(b.location),'zh-Hant');
      if(locCmp!==0) return locCmp;
      return venueSortValue(a.venue)-venueSortValue(b.venue)
        || daySortValue(a.day)-daySortValue(b.day)
        || timeSortValue(a.time)-timeSortValue(b.time);
    });

    const statusTag=(s)=>{
      if(s==='已公布') return '<span class="tag green">已公布</span>';
      if(s==='已完成') return '<span class="tag blue">已完成</span>';
      if(s==='處理中') return '<span class="tag warn">處理中</span>';
      return '<span class="tag gray">待抽籤</span>';
    };
    const anomalyText=(types)=>types.length
      ? types.map(t=>`<span class="tag warn" style="margin:2px 4px 2px 0;display:inline-block;">${escapeHtml(t)}</span>`).join('')
      : '<span class="tag gray">正常</span>';

    const rows=[...records].sort((a,b)=>{
      const locCmp=recordLocation(a).localeCompare(recordLocation(b),'zh-Hant');
      if(locCmp!==0) return locCmp;
      return venueSortValue(a.venue_type)-venueSortValue(b.venue_type) || daySortValue(a.day_of_week)-daySortValue(b.day_of_week) || timeSortValue(a.time_slot)-timeSortValue(b.time_slot) || statusSortValue(a.lottery_status)-statusSortValue(b.lottery_status) || String(a.registered_at||'').localeCompare(String(b.registered_at||''));
    });

    const stageLocations=[...new Set(stages.map(s=>s.location).filter(Boolean))]
      .sort((a,b)=>String(a).localeCompare(String(b),'zh-Hant'));
    const stageVenues=[...new Set(stages.map(s=>s.venue).filter(Boolean))]
      .sort((a,b)=>venueSortValue(a)-venueSortValue(b));
    const stageDays=[...new Set(stages.map(s=>s.day).filter(Boolean))]
      .sort((a,b)=>daySortValue(a)-daySortValue(b));

    if(window.stageListLocationFilter===undefined) window.stageListLocationFilter='';
    if(window.stageListVenueFilter===undefined) window.stageListVenueFilter='';
    if(window.stageListDayFilter===undefined) window.stageListDayFilter='';

    if(window.stageListLocationFilter && !stageLocations.includes(window.stageListLocationFilter)) window.stageListLocationFilter='';
    if(window.stageListVenueFilter && !stageVenues.includes(window.stageListVenueFilter)) window.stageListVenueFilter='';
    if(window.stageListDayFilter && !stageDays.includes(window.stageListDayFilter)) window.stageListDayFilter='';

    const visibleStages=stages.filter(s=>
      (!window.stageListLocationFilter || s.location===window.stageListLocationFilter) &&
      (!window.stageListVenueFilter || s.venue===window.stageListVenueFilter) &&
      (!window.stageListDayFilter || s.day===window.stageListDayFilter)
    );

    table.innerHTML=`
      <div class="panel" style="background:#f8fafc;">
        <h3>場次處理清單</h3>

        <div class="stage-list-filters">
          <div class="stage-list-filter-field">
            <label>場地</label>
            <select id="stageListLocationFilter">
              <option value="">全部場地</option>
              ${stageLocations.map(v=>`<option value="${escapeHtml(v)}" ${window.stageListLocationFilter===v?'selected':''}>${escapeHtml(locationLabel(v))}</option>`).join('')}
            </select>
          </div>

          <div class="stage-list-filter-field">
            <label>球類</label>
            <select id="stageListVenueFilter">
              <option value="">全部球類</option>
              ${stageVenues.map(v=>`<option value="${escapeHtml(v)}" ${window.stageListVenueFilter===v?'selected':''}>${escapeHtml(v)}</option>`).join('')}
            </select>
          </div>

          <div class="stage-list-filter-field">
            <label>星期</label>
            <select id="stageListDayFilter">
              <option value="">全部星期</option>
              ${stageDays.map(v=>`<option value="${escapeHtml(v)}" ${window.stageListDayFilter===v?'selected':''}>${escapeHtml(v)}</option>`).join('')}
            </select>
          </div>

          <button type="button" id="clearStageListFilters" class="btn btn-gray">全部顯示</button>

          <div class="stage-list-filter-count">顯示 <strong>${visibleStages.length}</strong> / ${stages.length} 個場次</div>
        </div>

        <div class="table-wrap"><table><thead><tr><th>場地</th><th>球類</th><th>星期</th><th>時段</th><th>登記人數</th><th>正取名額</th><th>抽籤狀態</th><th>異常</th></tr></thead><tbody>
          ${visibleStages.length ? visibleStages.map(s=>`<tr>
            <td>${escapeHtml(locationLabel(s.location))}</td>
            <td><strong>${escapeHtml(s.venue)}</strong></td>
            <td>${escapeHtml(s.day)}</td>
            <td>${escapeHtml(s.time)}</td>
            <td>${s.people}</td>
            <td>${s.capacity}</td>
            <td>${statusTag(s.status)}</td>
            <td>${anomalyText(s.anomalyTypes)}</td>
          </tr>`).join('') : `<tr><td colspan="8" style="text-align:center;color:#64748b;padding:24px;">目前選擇條件沒有場次</td></tr>`}
        </tbody></table></div>
      </div>
      <div class="panel">
        <h3>篩選結果清單</h3>
        <div class="table-wrap"><table><thead><tr><th>項次</th><th>抽籤狀態</th><th>公布</th><th>異常</th><th>序號</th><th>姓名</th><th>手機</th><th>後4碼</th><th>場地</th><th>球類</th><th>星期</th><th>時段</th><th>登記時間</th></tr></thead><tbody>
          ${rows.map((r,i)=>`<tr><td>${i+1}</td><td><span class="tag ${r.lottery_status==='中籤'?'green':String(r.lottery_status||'').startsWith('候補')?'warn':'gray'}">${escapeHtml(r.lottery_status||'未抽籤')}</span></td><td>${publishStatusTag(r)}</td><td>${anomalyTags(r)}</td><td><strong>${escapeHtml(r.serial_number)}</strong></td><td>${escapeHtml(r.name)}</td><td>${escapeHtml(r.phone)}</td><td>${escapeHtml(r.id_last4||'')}</td><td>${escapeHtml(locationLabel(recordLocation(r)))}</td><td>${escapeHtml(r.venue_type||'')}</td><td>${escapeHtml(r.day_of_week||'')}</td><td>${escapeHtml(r.time_slot)}</td><td>${r.registered_at?new Date(r.registered_at).toLocaleString('zh-TW',{hour12:false}):''}</td></tr>`).join('')}
        </tbody></table></div>
      </div>`;

    const stageLocationSelect=document.getElementById('stageListLocationFilter');
    const stageVenueSelect=document.getElementById('stageListVenueFilter');
    const stageDaySelect=document.getElementById('stageListDayFilter');
    const clearStageFilters=document.getElementById('clearStageListFilters');

    if(stageLocationSelect) stageLocationSelect.onchange=()=>{
      window.stageListLocationFilter=stageLocationSelect.value || '';
      renderDayCheck();
    };
    if(stageVenueSelect) stageVenueSelect.onchange=()=>{
      window.stageListVenueFilter=stageVenueSelect.value || '';
      renderDayCheck();
    };
    if(stageDaySelect) stageDaySelect.onchange=()=>{
      window.stageListDayFilter=stageDaySelect.value || '';
      renderDayCheck();
    };
    if(clearStageFilters) clearStageFilters.onclick=()=>{
      window.stageListLocationFilter='';
      window.stageListVenueFilter='';
      window.stageListDayFilter='';
      renderDayCheck();
    };
  }

  function getSelectedRecords(){
    const location=document.getElementById('lotLocation')?.value || DEFAULT_LOCATION;
    const venue=document.getElementById('lotVenue').value;
    const day=document.getElementById('lotDay').value;
    const time=document.getElementById('lotTime').value;
    const selectedComplete=!!location && !!venue && !!day && !!time;
    const records=selectedComplete ? allRecords.filter(r=>
      recordLocation(r)===location &&
      r.venue_type===venue &&
      r.day_of_week===day &&
      r.time_slot===time
    ) : [];
    return {location,venue,day,time,selectedComplete,records};
  }

  function localStatusValue(status){
    const s=String(status||'未抽籤');
    if(s==='中籤') return 1;
    if(s.startsWith('候補')) return 2 + (parseInt(s.replace('候補',''),10)||0);
    if(s==='未中籤') return 50;
    return 99;
  }

      document.getElementById('lotteryStageSummary').innerHTML=`
        <div class="panel" style="background:#f8fafc;margin-top:16px;">
          <h3>📊 本場次總表</h3>

      if(!okConfirm) return;
      const ok=await publishRecords(ids,true,{scope:'抽籤頁單一場次',venue:sorted[0].venue_type,day:sorted[0].day_of_week,time:sorted[0].time_slot});
      if(ok){

  const refresh=()=>{
    const {venue,day,time,selectedComplete,records}=getSelectedRecords();
    const locked=selectedComplete && records.length>0 && records.some(r=>r.lottery_locked === true || r.lottery_locked === 'true' || String(r.lottery_status||'').trim() !== '');

    const batch=`BUILTIN|${pending.location}|${pending.venue}|${pending.day}|${pending.time}|${new Date().toISOString()}`;
    const updateRows=[];
    result.winners.forEach(r=>updateRows.push({id:r.id,status:'中籤'}));
    result.waitlist.forEach((r,idx)=>updateRows.push({id:r.id,status:`候補${idx+1}`}));

    const groups={};
    updateRows.forEach(row=>{ if(!groups[row.status]) groups[row.status]=[]; groups[row.status].push(row.id); });

    for(const [status,ids] of Object.entries(groups)){
      const {error,data}=await db.from(RECORD_TABLE).update({
        lottery_status:status,
        lottery_batch:batch,
        lottery_locked:true,
        result_published:false,
        updated_at:new Date().toISOString()
      }).in('id',ids).select('id');

      winner_count:result.winners.length, waitlist_count:result.waitlist.length, loser_count:result.losers.length, total:updatedCount

  function batchStages(){
    const locationFilter=document.getElementById('batchLocation')?.value || DEFAULT_LOCATION;
    const venueFilter=document.getElementById('batchVenue')?.value || '';
    const dayStart=document.getElementById('batchDayStart')?.value || '';
    const dayEnd=document.getElementById('batchDayEnd')?.value || '';
    const timeStart=document.getElementById('batchTimeStart')?.value || '';
    const timeEnd=document.getElementById('batchTimeEnd')?.value || '';
    const winnerCountInput=Math.max(1, parseInt(document.getElementById('batchWinnerCount')?.value || '1',10));

    const dayOrder={'周一':1,'周二':2,'周三':3,'周四':4,'周五':5,'周六':6,'周日':7};
    const timeOrder={};
    times.forEach((t,i)=>timeOrder[t]=i+1);

    const startDayVal=dayStart ? dayOrder[dayStart] : 1;
    const endDayVal=dayEnd ? dayOrder[dayEnd] : 7;
    const startTimeVal=timeStart ? timeOrder[timeStart] : 1;
    const endTimeVal=timeEnd ? timeOrder[timeEnd] : 999;

    const map={};

    allRecords.forEach(r=>{
      if(locationFilter && recordLocation(r)!==locationFilter) return;
      if(venueFilter && r.venue_type!==venueFilter) return;

      const d=dayOrder[r.day_of_week] || 999;
      const t=timeOrder[r.time_slot] || 999;

      if(d < startDayVal || d > endDayVal) return;
      if(t < startTimeVal || t > endTimeVal) return;

      if(!r.venue_type || !r.day_of_week || !r.time_slot) return;

      const location=recordLocation(r);
      const key=`${location}|${r.venue_type}|${r.day_of_week}|${r.time_slot}`;

      if(!map[key]){
        map[key]={location,venue:r.venue_type,day:r.day_of_week,time:r.time_slot,records:[]};
      }

      map[key].records.push(r);
    });

    return Object.values(map).map(s=>{
      const peopleCount=new Set(s.records.map(r=>`${normalizePhone(r.phone)}|${r.id_last4||''}`)).size;

      const locked=s.records.some(r=>
        r.lottery_locked===true ||
        r.lottery_locked==='true' ||
        String(r.lottery_status||'').trim()!==''
      );

      return {
        ...s,
        winnerCount:winnerCountInput,
        peopleCount,
        locked,
        canDraw:!locked && winnerCountInput>0 && peopleCount>0
      };
    }).sort((a,b)=>{
      const vo={'羽球':1,'籃球':2,'B1桌球':3,'B2桌球':4};
      const doo={'周一':1,'周二':2,'周三':3,'周四':4,'周五':5,'周六':6,'周日':7};

      return (vo[a.venue]||9)-(vo[b.venue]||9)
        || (doo[a.day]||9)-(doo[b.day]||9)
        || String(a.time).localeCompare(String(b.time));
    });
  }

  async function runBatch(){
    const stages=batchStages().filter(s=>s.canDraw);
    if(stages.length===0){alert('沒有可批次抽籤的場次。請確認範圍、正取人數或是否已鎖定。');return;}
    const okConfirm=await confirmModal('確認批次抽籤',`確定要批次抽籤並鎖定 ${stages.length} 個場次嗎？
場地：${locationLabel(document.getElementById('batchLocation')?.value || DEFAULT_LOCATION)}`);
    if(!okConfirm) return;

    let totalExpected=0, totalUpdated=0;
    for(const s of stages){
      const waitCount=Math.max(0,s.peopleCount-s.winnerCount);
      const result=performLotteryWithWaitlist(s.records,s.winnerCount,waitCount);
      const batch=`BATCH|${s.location}|${s.venue}|${s.day}|${s.time}|${new Date().toISOString()}`;
      const rows=[];
      result.winners.forEach(r=>rows.push({id:r.id,status:'中籤'}));
      result.waitlist.forEach((r,i)=>rows.push({id:r.id,status:`候補${i+1}`}));
      result.losers.forEach(r=>rows.push({id:r.id,status:'未中籤'}));
      totalExpected += rows.length;
      const groups={};
      rows.forEach(x=>{ if(!groups[x.status]) groups[x.status]=[]; groups[x.status].push(x.id); });
      for(const [status,ids] of Object.entries(groups)){
        const {error,data}=await db.from(RECORD_TABLE).update({lottery_status:status,lottery_batch:batch,lottery_locked:true}).in('id',ids).select('id');
        if(error){alert('批次抽籤寫入失敗：'+(error.message||'未知錯誤'));console.error(error);return;}
        totalUpdated += (data||[]).length;
      }
    }
    await writeOperationLog('批次抽籤並鎖定', {stage_count:stages.length, total_updated:totalUpdated, total_expected:totalExpected}, []);
    alert(`批次抽籤完成，共更新 ${totalUpdated}/${totalExpected} 筆。`);
    await loadAllData();
    renderLotteryPage();
    switchBuiltInLotteryTab('batch');
  }

  document.getElementById('previewBatchLot').onclick=previewBatch;
  document.getElementById('runBatchLot').onclick=runBatch;
  ['batchLocation','batchVenue','batchDayStart','batchDayEnd','batchTimeStart','batchTimeEnd','batchWinnerCount'].forEach(id=>{
    const el=document.getElementById(id);
    if(el){
      el.onchange=previewBatch;
      el.oninput=previewBatch;
    }
  });

  renderDayCheck();
  previewBatch();
}

function getLotteryStatusSummary(records){
  if(!records || records.length===0) return '';
  const counts={};
  records.forEach(r=>{
    const s=r.lottery_status||'未抽籤';
    counts[s]=(counts[s]||0)+1;
  });
  return Object.entries(counts).map(([k,v])=>`${k}：${v}筆`).join('｜');
}

function performLotteryWithWaitlist(records,winnerCount,waitlistCount){
  const groups={};
  records.forEach(r=>{
    const key=`${normalizePhone(r.phone)}|${r.id_last4||''}|${r.day_of_week}|${r.venue_type}`;
    if(!groups[key]) groups[key]=[];
    groups[key].push(r);
  });

  const arr=Object.values(groups);
  const shuffled=[...arr];
  const randomIndex=(max)=>{
    if(max<=1) return 0;
    if(globalThis.crypto?.getRandomValues){
      const limit=Math.floor(0x100000000/max)*max;
      const buf=new Uint32Array(1);
      let x; do{ globalThis.crypto.getRandomValues(buf); x=buf[0]; }while(x>=limit);
      return x%max;
    }
    return Math.floor(Math.random()*max);
  };
  for(let i=shuffled.length-1;i>0;i--){
    const j=randomIndex(i+1);
    [shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];
  }

  const winnerGroups=shuffled.slice(0,Math.min(winnerCount,shuffled.length));
  const waitGroups=shuffled.slice(winnerGroups.length,winnerGroups.length+Math.max(0,waitlistCount));
  const loserGroups=shuffled.slice(winnerGroups.length+waitGroups.length);

  return {
    winners:winnerGroups.flat(),
    waitlist:waitGroups.flat(),
    losers:loserGroups.flat()
  };
}

        </div>
        ${suspiciousTag ? suspiciousTag(w) : ''}
      </div>`).join('');
  };
  box.innerHTML=`<div class="panel" style="background:${locked?'#f0fdf4':'#fffaf0'}">
    <h3>${title}</h3>
    ${renderList(result.winners,'中籤','#166534')}
    ${renderList(result.waitlist,'候補','#9a3412')}
    ${renderList(result.losers,'未中籤','#475569')}
  </div>`;
}

function exportToCsv(records){
  if(!records.length){alert('沒有資料可以匯出');return;}
  let csv='序號,抽籤狀態,公布狀態,鎖定,異常狀態,姓名,手機,身分證後4碼,地點,運動類型,星期,時段,登記時間\n';
  records.forEach(r=>{
    const state=isSuspiciousPhone(r)?'手機重複':'正常';
    csv += `"${r.serial_number||''}","${r.lottery_status||'未抽籤'}","${r.result_published?'已公布':'未公布'}","${r.lottery_locked?'已鎖定':'未鎖定'}","${state}","${r.name||''}","${r.phone||''}","${r.id_last4||''}","${r.location_name||''}","${r.venue_type||''}","${r.day_of_week||''}","${r.time_slot||''}","${r.registered_at||''}"\n`;
  });
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`登記清單_${new Date().toISOString().slice(0,10)}.csv`; a.click(); URL.revokeObjectURL(a.href);
}

<script id="safe-section-title-script">
(function(){
  function cleanTitle(text){
    return (text || '')
      .replace(/^[\s🎯📊📋⚠️➕🔐]+/g,'')
      .replace(/\s+/g,' ')
      .trim();
  }

  function movePanelTitles(){
    const root=document.getElementById('content');
    if(!root) return;

    const headings=root.querySelectorAll(
      '.panel > h3:first-child,' +
      '.panel > .anomaly-center-head:first-child > h3:first-child,' +
      '.panel > .dashboard-panel-heading:first-child > h3:first-child'
    );

    headings.forEach(function(h){
      const panel=h.closest('.panel');
      if(!panel || panel.dataset.titleOutside==='1') return;

      const title=cleanTitle(h.textContent);
      if(!title) return;

      const outside=document.createElement('div');
      outside.className='section-title-outside';
      outside.textContent=title;
      panel.parentNode.insertBefore(outside,panel);

      panel.dataset.titleOutside='1';
      panel.classList.add('section-title-moved');

      const wrapper=h.parentElement;
      h.remove();

      if(wrapper && wrapper!==panel &&
         (wrapper.classList.contains('anomaly-center-head') ||
          wrapper.classList.contains('dashboard-panel-heading')) &&
         wrapper.children.length===0){
        wrapper.remove();
      }
    });
  }

  function bindObserver(){
    const root=document.getElementById('content');
    if(!root || root.dataset.titleObserver==='1') return;

    const observer=new MutationObserver(function(){
      movePanelTitles();
    });
    observer.observe(root,{childList:true,subtree:true});
    root.dataset.titleObserver='1';
    movePanelTitles();
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',bindObserver);
  }else{
    bindObserver();
  }
})();
</script>
