name: Security regression (no production writes)

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'admin.html'
      - 'applicant-safe.html'
      - 'admin-session-policy.js'
      - 'admin-mfa.js'
      - 'tests/**'
      - '.github/workflows/security-regression.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'admin.html'
      - 'applicant-safe.html'
      - 'admin-session-policy.js'
      - 'admin-mfa.js'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript, Session policy and public boundaries
        run: node --test tests/security.test.cjs tests/mfa.test.cjs
