<!doctype html>
<html lang="zh-TW">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>北投會館運動場域智慧租借管理系統</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script>
    // 雲端版：登記資料寫入 Supabase，設定資料仍保留本機預設值
    let config = {
      app_title: '北投會館運動場域智慧租借管理系統',
      location_1: '北投會館',
      location_2: '地點名稱',
      admin_title: '管理後台'
    };
    const defaultConfig = { ...config };

    (function createLocalFallbacks() {
      const CONFIG_KEY = 'venue_lottery_config_v1';
      const DATA_KEY = 'venue_lottery_records_v1';

      function loadJson(key, fallback) {
        try {
          const raw = localStorage.getItem(key);
          return raw ? JSON.parse(raw) : fallback;
        } catch (err) {
          console.warn('讀取 localStorage 失敗', err);
          return fallback;
        }
      }

      function saveJson(key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
          return true;
        } catch (err) {
          console.warn('寫入 localStorage 失敗', err);
          alert('瀏覽器無法寫入本機資料，請確認未使用無痕模式，或改用一般視窗開啟。');
          return false;
        }
      }

      if (!window.elementSdk) {
        window.elementSdk = {
          init(options = {}) {
            const savedConfig = loadJson(CONFIG_KEY, options.defaultConfig || defaultConfig);
            config = { ...(options.defaultConfig || defaultConfig), ...savedConfig };
            if (typeof options.onConfigChange === 'function') {
              setTimeout(() => options.onConfigChange(config), 0);
            }
            return { isOk: true };
          }
        };
      }

      if (!window.dataSdk) {
        let handlerRef = null;

        const SUPABASE_URL = 'https://wsvsdwuksuzcjisnpyin.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_bH4MK0hvMqMSel3agqVwcw_aFsF3nIl';
        const SUPABASE_TABLE = 'lottery_records';

        function getSupabaseClient() {
          if (!window.supabase) {
            console.error('Supabase library not loaded');
            alert('雲端資料庫元件載入失敗，請重新整理頁面。');
            return null;
          }
          if (!window.__venueLotterySupabaseClient) {
            window.__venueLotterySupabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
          }
          return window.__venueLotterySupabaseClient;
        }

        function normalizeRecords(records) {
          return (records || []).map((record) => ({
            ...record,
            __backendId: record.id
          }));
        }

        async function fetchRecords() {
          const client = getSupabaseClient();
          if (!client) return { isOk: false, records: [] };

          const { data, error } = await client
            .from(SUPABASE_TABLE)
            .select('*')
            .order('registered_at', { ascending: false });

          if (error) {
            console.error('讀取 Supabase 失敗', error);
            return { isOk: false, records: [] };
          }

          return { isOk: true, records: normalizeRecords(data) };
        }

        async function refreshRecords() {
          const result = await fetchRecords();
          if (result.isOk && handlerRef && typeof handlerRef.onDataChanged === 'function') {
            handlerRef.onDataChanged(result.records);
          }
          return result;
        }

        window.dataSdk = {
          async init(handler) {
            handlerRef = handler;
            const result = await refreshRecords();

            const client = getSupabaseClient();
            if (client && !window.__venueLotteryRealtimeChannel) {
              window.__venueLotteryRealtimeChannel = client
                .channel('lottery_records_changes')
                .on('postgres_changes', {
                  event: '*',
                  schema: 'public',
                  table: SUPABASE_TABLE
                }, () => {
                  refreshRecords();
                })
                .subscribe();
            }

            return { isOk: result.isOk };
          },

          async create(record) {
            const client = getSupabaseClient();
            if (!client) return { isOk: false };

            const cleanRecord = {
              name: record.name,
              phone: record.phone,
              id_last4: record.id_last4,
              id_last4: record.id_last4 || '',
              location_name: record.location_name,
              venue_type: record.venue_type,
              day_of_week: record.day_of_week,
              time_slot: record.time_slot,
              serial_number: record.serial_number,
              registered_at: record.registered_at || new Date().toISOString()
            };

            const { data, error } = await client
              .from(SUPABASE_TABLE)
              .insert([cleanRecord])
              .select('*')
              .single();

            if (error) {
              console.error('寫入 Supabase 失敗', error);
              alert('登記失敗，請稍後再試。');
              return { isOk: false };
            }

            await refreshRecords();
            return { isOk: true, value: { ...data, __backendId: data.id } };
          },

          async delete(record) {
            const client = getSupabaseClient();
            if (!client) return { isOk: false };

            const recordId = record.id || record.__backendId;
            if (!recordId) {
              console.error('刪除失敗：找不到資料 id', record);
              alert('刪除失敗：找不到資料編號。');
              return { isOk: false };
            }

            const { error } = await client
              .from(SUPABASE_TABLE)
              .delete()
              .eq('id', recordId);

            if (error) {
              console.error('刪除 Supabase 資料失敗', error);
              alert('刪除失敗，請稍後再試。');
              return { isOk: false };
            }

            await refreshRecords();
            return { isOk: true };
          },

          async replaceAll(records) {
            const client = getSupabaseClient();
            if (!client) return { isOk: false };

            const { error: deleteError } = await client
              .from(SUPABASE_TABLE)
              .delete()
              .neq('id', '00000000-0000-0000-0000-000000000000');

            if (deleteError) {
              console.error('清空 Supabase 資料失敗', deleteError);
              return { isOk: false };
            }

            const cleanRecords = Array.isArray(records)
              ? records.map((record) => ({
                  name: record.name,
                  phone: record.phone,
                  id_last4: record.id_last4,
                  id_last4: record.id_last4 || '',
                  location_name: record.location_name,
                  venue_type: record.venue_type,
                  day_of_week: record.day_of_week,
                  time_slot: record.time_slot,
                  serial_number: record.serial_number,
                  registered_at: record.registered_at || new Date().toISOString()
                }))
              : [];

            if (cleanRecords.length > 0) {
              const { error: insertError } = await client
                .from(SUPABASE_TABLE)
                .insert(cleanRecords);

              if (insertError) {
                console.error('批次寫入 Supabase 失敗', insertError);
                return { isOk: false };
              }
            }

            await refreshRecords();
            return { isOk: true };
          }
        };
      }

      if (!window.capacitySdk) {
        let capacityHandlerRef = null;
        const CAPACITY_SUPABASE_URL = 'https://wsvsdwuksuzcjisnpyin.supabase.co';
        const CAPACITY_SUPABASE_KEY = 'sb_publishable_bH4MK0hvMqMSel3agqVwcw_aFsF3nIl';
        const CAPACITY_TABLE = 'lottery_capacity_settings';

        function getCapacitySupabaseClient() {
          if (!window.supabase) {
            console.error('Supabase library not loaded');
            alert('雲端資料庫元件載入失敗，請重新整理頁面。');
            return null;
          }
          if (!window.__venueLotterySupabaseClient) {
            window.__venueLotterySupabaseClient = window.supabase.createClient(CAPACITY_SUPABASE_URL, CAPACITY_SUPABASE_KEY);
          }
          return window.__venueLotterySupabaseClient;
        }

        function normalizeCapacityRows(rows) {
          const settings = {};
          const closedSettings = {};
          (rows || []).forEach((row) => {
            const key = `${row.venue_type}|${row.day_of_week}|${row.time_slot}`;
            settings[key] = Number(row.winner_count || 0);
            closedSettings[key] = row.is_closed === true;
          });
          return { settings, closedSettings };
        }

        async function fetchCapacitySettings() {
          const client = getCapacitySupabaseClient();
          if (!client) return { isOk: false, settings: {} };

          const { data, error } = await client
            .from(CAPACITY_TABLE)
            .select('*')
            .order('venue_type', { ascending: true });

          if (error) {
            console.error('讀取抽籤名額設定失敗', error);
            return { isOk: false, settings: {} };
          }

          const normalized = normalizeCapacityRows(data);
          return { isOk: true, settings: normalized.settings, closedSettings: normalized.closedSettings };
        }

        async function refreshCapacitySettings() {
          const result = await fetchCapacitySettings();
          if (result.isOk && capacityHandlerRef && typeof capacityHandlerRef.onSettingsChanged === 'function') {
            capacityHandlerRef.onSettingsChanged(result.settings, result.closedSettings);
          }
          return result;
        }

        window.capacitySdk = {
          async init(handler) {
            capacityHandlerRef = handler;
            const result = await refreshCapacitySettings();

            const client = getCapacitySupabaseClient();
            if (client && !window.__venueLotteryCapacityChannel) {
              window.__venueLotteryCapacityChannel = client
                .channel('lottery_capacity_settings_changes')
                .on('postgres_changes', {
                  event: '*',
                  schema: 'public',
                  table: CAPACITY_TABLE
                }, () => {
                  refreshCapacitySettings();
                })
                .subscribe();
            }

            return { isOk: result.isOk };
          },

          async upsert(setting) {
            const client = getCapacitySupabaseClient();
            if (!client) return { isOk: false };

            const cleanSetting = {
              venue_type: setting.venue_type,
              day_of_week: setting.day_of_week,
              time_slot: setting.time_slot,
              winner_count: Number(setting.winner_count || 0),
              is_closed: setting.is_closed === true,
              updated_at: new Date().toISOString()
            };

            const { error } = await client
              .from(CAPACITY_TABLE)
              .upsert(cleanSetting, {
                onConflict: 'venue_type,day_of_week,time_slot'
              });

            if (error) {
              console.error('儲存抽籤名額設定失敗', error);
              alert('儲存抽籤名額失敗，請稍後再試。');
              return { isOk: false };
            }

            await refreshCapacitySettings();
            return { isOk: true };
          }
        };
      }



      if (!window.settingsSdk) {
        const SETTINGS_SUPABASE_URL = 'https://wsvsdwuksuzcjisnpyin.supabase.co';
        const SETTINGS_SUPABASE_KEY = 'sb_publishable_bH4MK0hvMqMSel3agqVwcw_aFsF3nIl';
        const SETTINGS_TABLE = 'system_settings';

        function getSettingsSupabaseClient() {
          if (!window.supabase) {
            console.error('Supabase library not loaded');
            return null;
          }
          if (!window.__venueLotterySupabaseClient) {
            window.__venueLotterySupabaseClient = window.supabase.createClient(SETTINGS_SUPABASE_URL, SETTINGS_SUPABASE_KEY);
          }
          return window.__venueLotterySupabaseClient;
        }

        window.settingsSdk = {
          async getAll() {
            const client = getSettingsSupabaseClient();
            if (!client) return {};

            const { data, error } = await client
              .from(SETTINGS_TABLE)
              .select('*');

            if (error) {
              console.warn('讀取文字設定失敗', error);
              return {};
            }

            const settings = {};
            (data || []).forEach(row => {
              settings[row.key] = row.value || '';
            });

            return settings;
          }
        };
      }

      if (!window.lucide) {
        window.lucide = {
          createIcons() {
            document.querySelectorAll('[data-lucide="trash-2"]').forEach((el) => {
              el.removeAttribute('data-lucide');
              el.textContent = '🗑️';
              el.style.fontStyle = 'normal';
              el.style.fontSize = '16px';
              el.style.lineHeight = '1';
            });
          }
        };
      }
    })();

    window.elementSdk.init({
      defaultConfig,
      onConfigChange: (newConfig) => {
        config = newConfig;
        const titleEl = document.getElementById('app-title');
        const adminTitleEl = document.getElementById('admin-title');
        if (titleEl) titleEl.textContent = config.app_title;
        if (adminTitleEl) adminTitleEl.textContent = config.admin_title;
      },
      mapToCapabilities: () => ({
        recolorables: [],
        borderables: [],
        fontEditable: undefined,
        fontSizeable: undefined
      }),
      mapToEditPanelValues: (cfg) => new Map([
        ['app_title', cfg.app_title],
        ['location_1', cfg.location_1],
        ['location_2', cfg.location_2],
        ['admin_title', cfg.admin_title]
      ])
    });
  </script>

  <script>
    let allRecords = [];
    let lotterySettings = {};
    let closedSlotSettings = {};
    let systemSettings = {
      rules_content: '請於登記期間內完成資料填寫，抽籤結果將依公告時間公布。',
      register_notice: '請詳閱登記辦法後再進行登記。'
    };
    let currentSelection = {
      name: '',
      phone: '',
      id_last4: '',
      location: '',
      venue: '',
      day: '',
      time: ''
    };

    let pendingDeleteRecord = null;

    let turnstileToken = '';

    window.onTurnstileSuccess = function(token) {
      turnstileToken = token || '';
      const msg = document.getElementById('verification-message');
      if (msg && msg.textContent.includes('機器人')) msg.style.display = 'none';
    };

    window.onTurnstileExpired = function() {
      turnstileToken = '';
    };

    window.onTurnstileError = function() {
      turnstileToken = '';
    };

    // Capacity info by venue type
    const capacityMap = {
      '羽球': 3,
      '籃球': 1,
      'B1桌球': 5,
      'B2桌球': 4
    };

    // Data SDK handler
    const dataHandler = {
      onDataChanged(data) {
        allRecords = data || [];
        renderRecords();
        renderLotteryResults();
        if (currentSelection.venue && currentSelection.day) {
          renderTimeButtons();
        }

        // 若管理後台目前是開啟狀態，刪除或新增資料後同步重新繪製後台總表
        const adminModal = document.getElementById('admin-modal');
        if (adminModal && adminModal.classList.contains('active')) {
          renderAdminTable();
        }
      }
    };

    const capacityHandler = {
      onSettingsChanged(settings, closedSettings) {
        lotterySettings = settings || {};
        closedSlotSettings = closedSettings || {};
        if (currentSelection.venue && currentSelection.day) {
          renderTimeButtons();
        }
        const adminModal = document.getElementById('admin-modal');
        if (adminModal && adminModal.classList.contains('active')) {
          renderAdminTable();
        }
      }
    };


    function renderSystemTextSettings() {
      const formattedRules = String(systemSettings.rules_content || '請詳閱登記辦法。').replace(/\n/g, '<br>');

      const rulesBody = document.getElementById('rules-body');
      if (rulesBody) {
        rulesBody.innerHTML = formattedRules;
      }

      const rulesInlineBody = document.getElementById('rules-inline-body');
      if (rulesInlineBody) {
        rulesInlineBody.innerHTML = formattedRules;
      }

      const noticeBox = document.getElementById('register-notice-box');
      if (noticeBox && systemSettings.register_notice) {
        noticeBox.innerHTML = String(systemSettings.register_notice).replace(/\n/g, '<br>');
        noticeBox.style.display = 'block';
      }
    }

    async function loadSystemSettings() {
      if (!window.settingsSdk) {
        renderSystemTextSettings();
        return;
      }

      const settings = await window.settingsSdk.getAll();
      systemSettings = { ...systemSettings, ...(settings || {}) };
      renderSystemTextSettings();
    }

    // Initialize Data SDK and setup listeners
    async function initApp() {
      const initResult = await window.dataSdk.init(dataHandler);
      if (!initResult.isOk) {
        console.error('Data SDK init failed');
      }

      if (window.capacitySdk) {
        const capacityInitResult = await window.capacitySdk.init(capacityHandler);
        if (!capacityInitResult.isOk) {
          console.warn('Capacity SDK init failed. 請確認 Supabase 已建立 lottery_capacity_settings 資料表與權限。');
        }
      }

      await loadSystemSettings();

      // Setup all event listeners AFTER SDK is ready
      setupAllEventListeners();
      lucide.createIcons();
    }

    // Only initialize when DOM is fully ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }

    // ===== Functions =====
    function normalizePhoneNumber(value) {
      let phone = String(value || '').replace(/\D/g, '');
      if (phone.startsWith('8869') && phone.length === 12) {
        phone = '0' + phone.slice(3);
      }
      return phone;
    }

    function getPersonKey(record) {
      return `${normalizePhoneNumber(record.phone)}|${record.id_last4 || ''}`;
    }

    function detectSuspiciousPhones(records = allRecords) {
      const grouped = {};
      (records || []).forEach(r => {
        const phone = normalizePhoneNumber(r.phone);
        const last4 = r.id_last4 || '';
        if (!phone || !last4) return;
        if (!grouped[phone]) grouped[phone] = new Set();
        grouped[phone].add(last4);
      });
      const suspicious = {};
      Object.entries(grouped).forEach(([phone, ids]) => {
        if (ids.size >= 2) suspicious[phone] = true;
      });
      return suspicious;
    }

    
    function normalizePhone(value) {
      return String(value || '').replace(/\D/g, '').replace(/^886/, '0');
    }

    function samePersonRecord(record) {
      return normalizePhone(record.phone) === normalizePhone(currentSelection.phone) &&
             String(record.id_last4 || '') === String(currentSelection.id_last4 || '');
    }

        function showConfirmDelete(record, callback) {
      pendingDeleteRecord = record;
      document.getElementById('confirm-modal').classList.add('active');
      
      document.getElementById('confirm-delete').onclick = () => {
        document.getElementById('confirm-modal').classList.remove('active');
        callback(record);
      };
      
      document.getElementById('confirm-cancel').onclick = () => {
        document.getElementById('confirm-modal').classList.remove('active');
        pendingDeleteRecord = null;
      };
    }

    function renderLocationButtons() {
      const container = document.getElementById('location-buttons');
      const locations = [config.location_1].filter(l => l && l !== '地點名稱');
      container.innerHTML = locations.map(loc => `<button class="button-option" data-value="${loc}">${loc}</button>`).join('');
      container.querySelectorAll('.button-option').forEach(btn => {
        btn.addEventListener('click', () => {
          container.querySelectorAll('.button-option').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          currentSelection.location = btn.dataset.value;
          updateSummary();
          renderVenueButtons();
          enableVenueButtons();
          // Show venue section after location selected
          document.getElementById('venue-section').style.display = 'block';
        });

    function getTimeOptionsForVenue(venue) {
      return venue && venue.includes('桌球')
        ? ['09:00', '10:00', '11:00', '12:00', '13:00', '14:00', '15:00', '16:00', '17:00', '18:00', '19:00', '20:00', '21:00']
        : ['06:00', '08:00', '10:00', '12:00', '14:00', '16:00', '18:00', '20:00'];
    }

    function getLotterySettingKey(venue, day, timeSlot) {
      return `${venue}|${day}|${timeSlot}`;
    }

    function getTimeSlotForSetting(venue, startTime) {
      return formatTimeSlotDisplay(startTime, venue && venue.includes('桌球'));
    }

    function getLotteryWinnerCount(venue, day, startTime) {
      const timeSlot = getTimeSlotForSetting(venue, startTime);
      const settingKey = getLotterySettingKey(venue, day, timeSlot);
      const configured = lotterySettings[settingKey];
      if (configured !== undefined && configured !== null && configured !== '') {
        return Number(configured);
      }
      return capacityMap[venue] || 0;
    }

    function isLotterySlotClosed(venue, day, startTime) {
      const timeSlot = getTimeSlotForSetting(venue, startTime);
      const settingKey = getLotterySettingKey(venue, day, timeSlot);
      return closedSlotSettings[settingKey] === true;
    }

    function countRegistrationsForSlot(venue, day, startTime) {
      return allRecords.filter(r =>
        r.venue_type === venue &&
        r.day_of_week === day &&
        r.time_slot.includes(startTime)
      ).length;
    }

    function formatTimeSlotDisplay(startTime, isTableTennis) {
      const startHour = parseInt(String(startTime).split(':')[0], 10);
      if (Number.isNaN(startHour)) return startTime;

      // 桌球為 1 小時；羽球／籃球依目前前台規則為 2 小時時段。
      const endHour = isTableTennis ? startHour : startHour + 1;
      const endTimeStr = String(endHour).padStart(2, '0') + ':59';
      return `${startTime}-${endTimeStr}`;
    }

    function generateSerialNumber() {
      const now = new Date();
      const dateStr = now.getFullYear().toString().slice(-2) + 
                      String(now.getMonth() + 1).padStart(2, '0') + 
                      String(now.getDate()).padStart(2, '0');
      const random = String(Math.floor(Math.random() * 1000000)).padStart(6, '0');
      return `${dateStr}${random}`;
    }

    function detectContinuousGroups(times) {
      const timeMap = {
        '06:00': 6, '08:00': 8, '10:00': 10, '12:00': 12, '14:00': 14, '16:00': 16, '18:00': 18, '20:00': 20,
        '09:00': 9, '11:00': 11, '13:00': 13, '15:00': 15, '17:00': 17, '19:00': 19, '21:00': 21
      };
      
      const sortedTimes = times.sort((a, b) => timeMap[a] - timeMap[b]);
      const groups = [];
      let currentGroup = [sortedTimes[0]];
      
      for (let i = 1; i < sortedTimes.length; i++) {
        const current = timeMap[sortedTimes[i]];
        const previous = timeMap[sortedTimes[i-1]];
        if (current - previous === 1) {
          currentGroup.push(sortedTimes[i]);
        } else {
          groups.push(currentGroup);
          currentGroup = [sortedTimes[i]];
        }
      }
      groups.push(currentGroup);
      
      return groups;
    }

    function formatTimeRangeForSubmit(times) {
      const timeMap = {
        '06:00': 6, '08:00': 8, '10:00': 10, '12:00': 12, '14:00': 14, '16:00': 16, '18:00': 18, '20:00': 20,
        '09:00': 9, '11:00': 11, '13:00': 13, '15:00': 15, '17:00': 17, '19:00': 19, '21:00': 21
      };
      
      const sortedTimes = times.sort((a, b) => timeMap[a] - timeMap[b]);
      const startTime = sortedTimes[0];
      const lastTime = sortedTimes[sortedTimes.length - 1];
      const lastHour = lastTime.split(':')[0];
      
      return `${startTime}-${lastHour}:59`;
    }

    async function submitRegistration() {
      if (!currentSelection.name || !currentSelection.phone || !currentSelection.id_last4 || !currentSelection.location || !currentSelection.venue || !currentSelection.day || !currentSelection.time) {
        return;
      }

      const isTableTennis = currentSelection.venue.includes('桌球');
      const limitedSports = ['羽球', '籃球'];
      const duplicatedPerson = limitedSports.includes(currentSelection.venue) && allRecords.some(r =>
        normalizePhoneNumber(r.phone) === currentSelection.phone &&
        (r.id_last4 || '') === currentSelection.id_last4 &&
        r.venue_type === currentSelection.venue
      );

      if (duplicatedPerson) {
        alert('此手機號碼與身分證後4碼已登記過此運動類型。羽球與籃球各限登記一次；如需修改，請先刪除原登記紀錄後重新登記。');
        return;
      }
      const selectedTimes = isTableTennis 
        ? currentSelection.time.split(', ').filter(t => t.trim())
        : [currentSelection.time];

      const containsClosedSlot = selectedTimes.some(time =>
        isLotterySlotClosed(currentSelection.venue, currentSelection.day, time)
      );
      if (containsClosedSlot) {
        alert('所選時段目前不開放登記，請重新選擇其他時段。');
        currentSelection.time = '';
        renderTimeButtons();
        updateSummary();
        return;
      }
      
      if (isTableTennis) {
        const groups = detectContinuousGroups(selectedTimes);
        
        for (const group of groups) {
          const serialNumber = generateSerialNumber();
          const timeRange = formatTimeRangeForSubmit(group);
          const result = await window.dataSdk.create({
            name: currentSelection.name,
            phone: currentSelection.phone,
            id_last4: currentSelection.id_last4,
            location_name: currentSelection.location,
            venue_type: currentSelection.venue,
            day_of_week: currentSelection.day,
            time_slot: timeRange,
            registered_at: new Date().toISOString(),
            serial_number: serialNumber
          });

          if (!result.isOk) {
            return;
          }
        }
      } else {
        const serialNumber = generateSerialNumber();
        const timeSlotWithEnd = formatTimeSlotDisplay(selectedTimes[0], false);
        const result = await window.dataSdk.create({
          name: currentSelection.name,
          phone: currentSelection.phone,
          id_last4: currentSelection.id_last4,
          location_name: currentSelection.location,
          venue_type: currentSelection.venue,
          day_of_week: currentSelection.day,
          time_slot: timeSlotWithEnd,
          registered_at: new Date().toISOString(),
          serial_number: serialNumber
        });

        if (!result.isOk) {
          return;
        }
      }

      currentSelection.venue = '';
      currentSelection.day = '';
      currentSelection.time = '';
      
      document.querySelectorAll('#venue-buttons .button-option').forEach(b => b.classList.remove('selected'));
      document.querySelectorAll('#date-buttons .button-option').forEach(b => b.classList.remove('selected'));
      document.querySelectorAll('#time-buttons .button-option').forEach(b => b.classList.remove('selected'));
      
      updateSummary();
      
      renderRecords();
      renderLotteryResults();

      const successBox = document.getElementById('registration-success');
      if (successBox) {
        successBox.style.display = 'block';
        successBox.scrollIntoView({behavior:'smooth', block:'center'});
      }
    }

    function updateSummary() {
      document.getElementById('summary-name').textContent = currentSelection.name || '-';
      document.getElementById('summary-phone').textContent = currentSelection.phone || '-';
      const summaryIdLast4 = document.getElementById('summary-id-last4');
      if (summaryIdLast4) summaryIdLast4.textContent = currentSelection.id_last4 || '-';
      document.getElementById('summary-location').textContent = currentSelection.location || '-';

          const groups = detectContinuousGroups(times);

        } else {
          document.getElementById('summary-time').textContent = formatTimeSlotDisplay(currentSelection.time, false);
        }
      } else {
        document.getElementById('summary-time').textContent = '-';
      }
    }


    function getLotteryStatusClass(status, record = null) {
      if (record && record.lottery_status && !record.result_published) {
        return 'lottery-status-wait';
      }
      const s = String(status || '');
      if (s === '中籤') return 'lottery-status-win';
      if (s.startsWith('候補')) return 'lottery-status-wait';
      if (s === '未中籤') return 'lottery-status-lose';
      return 'lottery-status-none';
    }

    function getLotteryStatusText(record) {
      if (!record.result_published) {
        return record.lottery_status ? '結果尚未公布' : '尚未抽籤';
      }
      return record.lottery_status || '尚未抽籤';
    }

    function getLotteryResultNote(record) {
      const status = String(record.lottery_status || '');
      const publishedAt = record.published_at
        ? new Date(record.published_at).toLocaleString('zh-TW', {month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hour12:false})
        : '';

      if (status && !record.result_published) {
        return '<div class="lottery-result-note" style="background:#fff7ed;color:#9a3412;border-left:4px solid #f97316;">抽籤結果尚未公布，請留意後續公告。</div>';
      }

      if (!record.result_published) {
        return '<div class="lottery-result-note" style="background:#e5f2f7;color:#075985;border-left:4px solid var(--primary-blue);">目前尚未抽籤或尚未公布結果，請留意後續公告。</div>';
      }

      const statusClass = getLotteryStatusClass(status, record);
      const resultText = status || '尚未抽籤';
      let note = '';
      if (status === '中籤') note = '🎉 恭喜中籤！請留意後續繳費或辦理通知。';
      else if (status.startsWith('候補')) note = `⏳ 目前為${status}，若有名額釋出將依序通知。`;
      else if (status === '未中籤') note = '本次未中籤，感謝您的登記。';
      else note = '目前尚未抽籤，請留意後續公告。';

      return `
        <div class="formal-result-card">
          <div class="formal-result-title">您的抽籤結果已公布</div>
          <div class="formal-result-main">結果：<span class="lottery-status-badge ${statusClass}" style="margin-left:0;">${resultText}</span></div>
          <div class="formal-result-meta">${note}</div>
          ${publishedAt ? `<div class="formal-result-meta">公布時間：${publishedAt}</div>` : ''}
        </div>
      `;
    }

      const userRecords = allRecords.filter(r => `${normalizePhoneNumber(r.phone)}|${r.id_last4 || ''}` === currentUserKey);

      let totalHours = 0;
      const timeMap = {
        '06:00': 6, '08:00': 8, '10:00': 10, '12:00': 12, '14:00': 14, '16:00': 16, '18:00': 18, '20:00': 20,

          const endHourStr = endTime.split(':')[0];

            recordTimeHours = endHour - startHour + 1;

              displayTimeText += ` (${recordTimeHours}小時)`;
            }
          } else {

            displayTimeText = `${record.day_of_week} ${record.time_slot}`;
            recordTimeHours = isTableTennis ? 1 : 2;

              displayTimeText += ` (連續${recordTimeHours}小時)`;
            } else {
              displayTimeText += ` (${recordTimeHours}小時)`;
            }

            }

    function formatTimeRange(times) {
      const timeMap = {
        '06:00': 6, '08:00': 8, '10:00': 10, '12:00': 12, '14:00': 14, '16:00': 16, '18:00': 18, '20:00': 20,
        '09:00': 9, '11:00': 11, '13:00': 13, '15:00': 15, '17:00': 17, '19:00': 19, '21:00': 21
      };
      
      const sortedTimes = times.sort((a, b) => timeMap[a] - timeMap[b]);
      
      let isConsecutive = true;
      for (let i = 1; i < sortedTimes.length; i++) {
        const current = timeMap[sortedTimes[i]];
        const previous = timeMap[sortedTimes[i-1]];
        if (current - previous !== 1) {
          isConsecutive = false;
          break;
        }
      }
      
      if (isConsecutive && sortedTimes.length > 1) {
        const startTime = sortedTimes[0];
        const lastTime = sortedTimes[sortedTimes.length - 1];
        const hours = sortedTimes.length;
        return `${startTime}-${lastTime.split(':')[0]}:59 (連續${hours}小時)`;
      } else if (sortedTimes.length === 1) {
        const timeStr = sortedTimes[0];
        const hour = timeStr.split(':')[0];
        return `${timeStr}-${hour}:59 (1小時)`;
      } else {
        const parts = sortedTimes.map(time => {
          const hour = time.split(':')[0];
          return `${time}-${hour}:59`;
        });
        return parts.join(' / ');
      }
    }

    function getUniqueValues(key) {
      const values = new Set(allRecords.map(r => r[key]));
      return Array.from(values).sort();
    }

    function applyFilters(venueFilter, dayFilter, timeFilter) {
      return allRecords.filter(r => {
        if (venueFilter && r.venue_type !== venueFilter) return false;
        if (dayFilter && r.day_of_week !== dayFilter) return false;
        if (timeFilter && r.time_slot !== timeFilter) return false;
        return true;
      });
    }

    function performLottery(records, winnerCount) {
      if (records.length === 0) return [];
      
      const groupedByPersonDayVenue = {};
      records.forEach(r => {
        const key = `${normalizePhoneNumber(r.phone)}|${r.id_last4 || ''}|${r.day_of_week}|${r.venue_type}`;
        if (!groupedByPersonDayVenue[key]) {
          groupedByPersonDayVenue[key] = [];
        }
        groupedByPersonDayVenue[key].push(r);
      });
      
      const uniqueGroups = Object.values(groupedByPersonDayVenue);
      if (uniqueGroups.length === 0) return [];
      if (winnerCount >= uniqueGroups.length) return records;
      
      const shuffled = [...uniqueGroups].sort(() => Math.random() - 0.5);
      const selectedGroups = shuffled.slice(0, Math.min(winnerCount, uniqueGroups.length));
      
      const winners = selectedGroups.flat();
      
      return winners;
    }

    function exportToExcel(records) {
      if (records.length === 0) return;
      
      const suspiciousPhones = detectSuspiciousPhones(records);
      let csv = '序號,姓名,手機,身分證後4碼,異常標記,地點,運動類型,日期,時段,登記時間\n';
      
      records.forEach(r => {
        const regDate = new Date(r.registered_at).toLocaleString('zh-TW', { 
          year: 'numeric', 
          month: '2-digit', 
          day: '2-digit', 
          hour: '2-digit', 
          minute: '2-digit',
          hour12: false
        });
        
        const isSuspicious = suspiciousPhones[normalizePhoneNumber(r.phone)] ? '同手機不同身分證後4碼' : '';
        csv += `"${r.serial_number}","${r.name}","${r.phone}","${r.id_last4 || ''}","${isSuspicious}","${r.location_name}","${r.venue_type}","${r.day_of_week}","${r.time_slot}","${regDate}"\n`;
      });
      
      const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      const url = URL.createObjectURL(blob);
      
      link.setAttribute('href', url);
      link.setAttribute('download', `登記清單_${new Date().toISOString().split('T')[0]}.csv`);
      link.style.visibility = 'hidden';
      
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function calculateDetailedStats(records = allRecords) {
      const totalRegistrations = records.length;
      const uniqueUsers = new Set(records.map(r => `${normalizePhoneNumber(r.phone)}|${r.id_last4 || ''}`)).size;
      
      const timeMap = {
        '06:00': 6, '08:00': 8, '10:00': 10, '12:00': 12, '14:00': 14, '16:00': 16, '18:00': 18, '20:00': 20,
        '09:00': 9, '11:00': 11, '13:00': 13, '15:00': 15, '17:00': 17, '19:00': 19, '21:00': 21
      };
      
      let totalHours = 0;
      records.forEach(r => {
        if (r.time_slot.includes('-')) {
          const [startTime, endTime] = r.time_slot.split('-');
          const startHour = timeMap[startTime] || parseInt(startTime);
          const endHourStr = endTime.split(':')[0];
          const endHour = parseInt(endHourStr);
          totalHours += endHour - startHour + 1;
        } else {
          const isTableTennis = r.venue_type.includes('桌球');
          totalHours += isTableTennis ? 1 : 2;
        }
      });
      
      const byVenue = {};
      records.forEach(r => {
        if (!byVenue[r.venue_type]) {
          byVenue[r.venue_type] = {
            count: 0,
            people: new Set(),
            hours: 0
          };
        }
        byVenue[r.venue_type].count++;
        byVenue[r.venue_type].people.add(`${normalizePhoneNumber(r.phone)}|${r.id_last4 || ''}`);
        
        if (r.time_slot.includes('-')) {
          const [startTime, endTime] = r.time_slot.split('-');
          const startHour = timeMap[startTime] || parseInt(startTime);
          const endHourStr = endTime.split(':')[0];
          const endHour = parseInt(endHourStr);
          byVenue[r.venue_type].hours += endHour - startHour + 1;
        } else {
          const isTableTennis = r.venue_type.includes('桌球');
          byVenue[r.venue_type].hours += isTableTennis ? 1 : 2;
        }
      });
      
      Object.keys(byVenue).forEach(venue => {
        byVenue[venue].people = byVenue[venue].people.size;
      });
      
      return { totalRegistrations, uniqueUsers, totalHours, byVenue };
    }

    function generateChart(records = null) {
      const dataToChart = records || allRecords;
      if (!dataToChart || dataToChart.length === 0) {
        return '<div style="text-align: center; color: #999; padding: 20px;">無資料可顯示</div>';
      }

      const grouped = {};
      dataToChart.forEach(r => {
        const key = `${r.venue_type}|${r.time_slot}`;
        if (!grouped[key]) {
          grouped[key] = 0;
        }
        grouped[key]++;
      });
      
      const venues = {};
      Object.entries(grouped).forEach(([key, count]) => {
        const [venueType, timeSlot] = key.split('|');
        if (!venues[venueType]) {
          venues[venueType] = {};
        }
        venues[venueType][timeSlot] = count;
      });
      
      const allTimeSlots = new Set();
      Object.values(venues).forEach(venueTimes => {
        Object.keys(venueTimes).forEach(time => allTimeSlots.add(time));
      });
      const sortedTimeSlots = Array.from(allTimeSlots).sort();
      
      if (sortedTimeSlots.length === 0) {
        return '<div style="text-align: center; color: #999; padding: 20px;">無資料可顯示</div>';
      }
      
      const chartWidth = 800;
      const chartHeight = 300;
      const padding = 50;
      const innerWidth = chartWidth - 2 * padding;
      const innerHeight = chartHeight - 2 * padding;
      
      const xSpacing = innerWidth / (sortedTimeSlots.length - 1 || 1);
      const maxCount = Math.max(...Object.values(venues).flatMap(v => Object.values(v)), 5);
      const ySpacing = innerHeight / maxCount;
      
      const venueColors = {
        '羽球': '#FF6B6B',
        '籃球': '#4ECDC4',
        'B1桌球': '#45B7D1',
        'B2桌球': '#FFA07A'
      };
      
      let svg = `<svg width="${chartWidth}" height="${chartHeight}" style="border: 1px solid #e5e7eb; border-radius: 8px; margin: 16px 0;">`;
      
      for (let i = 0; i <= maxCount; i++) {
        const y = padding + innerHeight - (i * ySpacing);
        svg += `<line x1="${padding}" y1="${y}" x2="${chartWidth - padding}" y2="${y}" stroke="#e5e7eb" stroke-width="1"/>`;
        svg += `<text x="${padding - 10}" y="${y + 4}" font-size="11" text-anchor="end" fill="#666">${i}</text>`;
      }
      
      sortedTimeSlots.forEach((time, idx) => {
        const x = padding + idx * xSpacing;
        svg += `<line x1="${x}" y1="${padding + innerHeight}" x2="${x}" y2="${padding + innerHeight + 5}" stroke="#999" stroke-width="1"/>`;
        svg += `<text x="${x}" y="${padding + innerHeight + 20}" font-size="11" text-anchor="middle" fill="#666">${time}</text>`;
      });
      
      Object.entries(venues).forEach(([venueType, venueTimes]) => {
        const color = venueColors[venueType] || '#999';
        const points = [];
        
        sortedTimeSlots.forEach((time, idx) => {
          const count = venueTimes[time] || 0;
          const x = padding + idx * xSpacing;
          const y = padding + innerHeight - (count * ySpacing);
          points.push(`${x},${y}`);
        });
        
        if (points.length > 0) {
          svg += `<polyline points="${points.join(' ')}" stroke="${color}" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
          
          sortedTimeSlots.forEach((time, idx) => {
            const count = venueTimes[time] || 0;
            const x = padding + idx * xSpacing;
            const y = padding + innerHeight - (count * ySpacing);
            svg += `<circle cx="${x}" cy="${y}" r="4" fill="${color}"/>`;
            if (count > 0) {
              svg += `<text x="${x}" y="${y - 10}" font-size="11" text-anchor="middle" fill="${color}" font-weight="600">${count}</text>`;
            }
          });
        }
      });
      
      svg += `</svg>`;
      
      let legend = '<div style="display: flex; gap: 20px; margin: 16px 0; flex-wrap: wrap;">';
      Object.entries(venueColors).forEach(([venue, color]) => {
        legend += `<div style="display: flex; align-items: center; gap: 8px;"><div style="width: 16px; height: 2px; background: ${color};"></div><span style="font-size: 13px;">${venue}</span></div>`;
      });
      legend += '</div>';
      
      return svg + legend;
    }

      if (chosen === 'large') document.body.classList.add('front-font-large');
      if (chosen === 'xlarge') document.body.classList.add('front-font-xlarge');

      document.querySelectorAll('.font-menu-option').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.frontFont === chosen);
      });

      try {
        localStorage.setItem('venue_front_font_size', chosen);
      } catch (e) {

    function initFrontFontSize() {
      let saved = 'standard';
      try {
        saved = localStorage.getItem('venue_front_font_size') || 'standard';
      } catch (e) {}

      const popover = document.getElementById('font-menu-popover');

      document.querySelectorAll('.font-menu-option').forEach(btn => {

          if (popover) popover.style.display = 'none';
          if (trigger) trigger.setAttribute('aria-expanded', 'false');
        });
      });

      if (trigger && popover) {
        trigger.addEventListener('click', (e) => {
          e.stopPropagation();
          const isOpen = popover.style.display !== 'none';
          popover.style.display = isOpen ? 'none' : 'block';
          trigger.setAttribute('aria-expanded', isOpen ? 'false' : 'true');
        });

        popover.addEventListener('click', (e) => e.stopPropagation());
        document.addEventListener('click', () => {
          popover.style.display = 'none';
          trigger.setAttribute('aria-expanded', 'false');
        });
      }
    }

            msg.textContent = '請填寫姓名、手機號碼和身分證後4碼';
            msg.style.backgroundColor = '#FEE2E2';
            msg.style.color = '#7F1D1D';
            msg.style.display = 'block';
            return;
          }

          if (!/^09\d{8}$/.test(phone)) {
            msg.textContent = '請輸入正確的手機號碼格式，例如 0912345678';
            msg.style.backgroundColor = '#FEE2E2';
            msg.style.color = '#7F1D1D';
            msg.style.display = 'block';
            return;
          }

          if (!/^\d{4}$/.test(idLast4)) {
            msg.textContent = '請輸入正確的身分證後4碼';
            msg.style.backgroundColor = '#FEE2E2';
            msg.style.color = '#7F1D1D';
            msg.style.display = 'block';
            return;
          }

          const currentTurnstileToken =
            turnstileToken ||
            (window.turnstile && typeof window.turnstile.getResponse === 'function'
              ? window.turnstile.getResponse()
              : '');

          if (!currentTurnstileToken) {
            msg.textContent = '請先完成機器人驗證';
            msg.style.backgroundColor = '#FEE2E2';
            msg.style.color = '#7F1D1D';
            msg.style.display = 'block';
            return;
          }

          try {
            verifyBtn.disabled = true;
            verifyBtn.textContent = '驗證中...';

            const turnstileResponse = await fetch('https://wsvsdwuksuzcjisnpyin.supabase.co/functions/v1/verify-turnstile', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({ token: currentTurnstileToken })
            });

            const turnstileResult = await turnstileResponse.json().catch(() => ({ success: false }));

            if (!turnstileResponse.ok || !turnstileResult.success) {
              const errorCodes = Array.isArray(turnstileResult.errorCodes)
                ? turnstileResult.errorCodes
                : [];

              let detail = '';
              if (errorCodes.length) {
                detail = `（${errorCodes.join(', ')}）`;
              } else if (turnstileResult.message) {
                detail = `（${turnstileResult.message}）`;
              }

              msg.textContent = `機器人驗證未通過${detail}`;
              msg.style.backgroundColor = '#FEE2E2';
              msg.style.color = '#7F1D1D';
              msg.style.display = 'block';

              console.warn('Turnstile verify failed:', turnstileResult);

              turnstileToken = '';
              if (window.turnstile) window.turnstile.reset();
              if (msg && typeof msg.scrollIntoView === 'function') {
                msg.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
              }
              return;
            }
          } catch (error) {
            console.error('Turnstile verification failed', error);
            msg.textContent = '機器人驗證服務暫時無法使用，請稍後再試（network-error）';
            msg.style.backgroundColor = '#FEE2E2';
            msg.style.color = '#7F1D1D';
            msg.style.display = 'block';
            turnstileToken = '';
            if (window.turnstile) window.turnstile.reset();
            return;
          } finally {
            verifyBtn.disabled = false;
            verifyBtn.textContent = '驗證身分並進入';
          }

          currentSelection.name = name;
          currentSelection.phone = phone;
          currentSelection.id_last4 = idLast4;

          const verifyForm = document.getElementById('verify-form');
          const memberDisplay = document.getElementById('member-display');
          const locationSection = document.getElementById('location-section');
          const venueSection = document.getElementById('venue-section');
          const dateSection = document.getElementById('date-section');
          const timeSection = document.getElementById('time-section');
          const summarySection = document.getElementById('summary-section');
          const recordsSection = document.getElementById('records-section');

          if (verifyForm) verifyForm.style.display = 'none';
          if (memberDisplay) memberDisplay.style.display = 'block';
          
          const displayName = document.getElementById('display-name');
          const displayPhone = document.getElementById('display-phone');
          if (displayName) displayName.textContent = name;
          if (phoneEl) phoneEl.value = phone;
          if (displayPhone) displayPhone.textContent = `${phone}｜後4碼 ${idLast4}`;

          const verificationSection = document.getElementById('verification-section');
          if (verificationSection) verificationSection.classList.add('verified');

          const headerMemberMini = document.getElementById('header-member-mini');
          const headerMemberName = document.getElementById('header-member-name');
          const headerMemberPhone = document.getElementById('header-member-phone');
          if (headerMemberName) headerMemberName.textContent = name;
          if (headerMemberPhone) headerMemberPhone.textContent = `${phone}｜末4碼 ${idLast4}`;
          const headerMemberRow = document.getElementById('header-member-row');
          if (headerMemberRow) headerMemberRow.style.display = 'flex';

          // 顯示登入後功能導覽，預設進入「場次登記」
          const memberTabsWrap = document.getElementById('member-tabs-wrap');
          if (memberTabsWrap) memberTabsWrap.style.display = 'block';

          if (locationSection) locationSection.style.display = 'block';
          if (venueSection) venueSection.style.display = 'block';
          if (dateSection) dateSection.style.display = 'block';
          if (timeSection) timeSection.style.display = 'block';
          if (summarySection) summarySection.style.display = 'block';

          const registerTabPanel = document.getElementById('register-tab-panel');
          const recordsTabPanel = document.getElementById('records-tab-panel');
          const resultsTabPanel = document.getElementById('results-tab-panel');

          const rulesTabPanel = document.getElementById('rules-tab-panel');

          if (registerTabPanel) registerTabPanel.style.display = 'none';
          if (recordsTabPanel) recordsTabPanel.style.display = 'none';
          if (resultsTabPanel) resultsTabPanel.style.display = 'none';
          if (rulesTabPanel) rulesTabPanel.style.display = 'none';

          document.querySelectorAll('.member-folder-tab').forEach(btn=>btn.classList.remove('active'));
          setFlowStep(2);
          

          // Auto-select 北投會館
          currentSelection.location = config.location_1;
          currentSelection.venue = '';
          currentSelection.day = '';
          currentSelection.time = '';
          
          // Render ALL buttons including location
          renderLocationButtons();
          renderVenueButtons();
          renderDateButtons();
          renderTimeButtons();
          
          // Auto-click location button to select it
          const locationBtn = document.querySelector('#location-buttons .button-option');
          if (locationBtn) {
            locationBtn.click();
          }
          
          // Enable venue buttons since location is already selected
          enableVenueButtons();
          
          // Disable date, time initially
          disableDateButtons();
          disableTimeButtons();
          
          updateSummary();
          renderRecords();
          switchMemberTab('register');
        });
      }

      const headerLogoutBtn = document.getElementById('header-logout-btn');
      if (headerLogoutBtn && logoutBtn) {
        headerLogoutBtn.addEventListener('click', () => logoutBtn.click());
      }

      if (logoutBtn) {
        logoutBtn.addEventListener('click', () => {
          const verifyForm = document.getElementById('verify-form');
          const memberDisplay = document.getElementById('member-display');
          const locationSection = document.getElementById('location-section');
          const venueSection = document.getElementById('venue-section');
          const dateSection = document.getElementById('date-section');
          const timeSection = document.getElementById('time-section');
          const summarySection = document.getElementById('summary-section');
          const recordsSection = document.getElementById('records-section');
          const nameEl = document.getElementById('member-name');
          const phoneEl = document.getElementById('member-phone');
          const idLast4El = document.getElementById('member-id-last4');
          const verificationMessage = document.getElementById('verification-message');

          if (verifyForm) verifyForm.style.display = 'block';
          const verificationSection = document.getElementById('verification-section');
          if (verificationSection) verificationSection.classList.remove('verified');
          if (memberDisplay) memberDisplay.style.display = 'none';
          const headerMemberMini = document.getElementById('header-member-mini');
          const headerMemberRow = document.getElementById('header-member-row');
          if (headerMemberRow) headerMemberRow.style.display = 'none';
          const fontMenuPopover = document.getElementById('font-menu-popover');
          const fontMenuTrigger = document.getElementById('font-menu-trigger');
          if (fontMenuPopover) fontMenuPopover.style.display = 'none';
          if (fontMenuTrigger) fontMenuTrigger.setAttribute('aria-expanded', 'false');
          if (nameEl) nameEl.value = '';
          if (phoneEl) phoneEl.value = '';
          if (idLast4El) idLast4El.value = '';
          turnstileToken = '';
          if (window.turnstile) window.turnstile.reset();
          if (verificationMessage) verificationMessage.style.display = 'none';
          if (locationSection) locationSection.style.display = 'none';
          if (venueSection) venueSection.style.display = 'none';
          if (dateSection) dateSection.style.display = 'none';
          if (timeSection) timeSection.style.display = 'none';
          if (summarySection) summarySection.style.display = 'none';

          const memberTabsWrap = document.getElementById('member-tabs-wrap');
          const registerTabPanel = document.getElementById('register-tab-panel');
          const recordsTabPanel = document.getElementById('records-tab-panel');
          const resultsTabPanel = document.getElementById('results-tab-panel');
          const rulesTabPanel = document.getElementById('rules-tab-panel');
          const registrationSuccess = document.getElementById('registration-success');

          if (memberTabsWrap) memberTabsWrap.style.display = 'none';
          if (registerTabPanel) registerTabPanel.style.display = 'block';
          if (recordsTabPanel) recordsTabPanel.style.display = 'none';
          if (resultsTabPanel) resultsTabPanel.style.display = 'none';
          if (rulesTabPanel) rulesTabPanel.style.display = 'none';
          if (registrationSuccess) registrationSuccess.style.display = 'none';
          document.querySelectorAll('.member-folder-tab').forEach(btn=>btn.classList.remove('active'));
          setFlowStep(1);

          currentSelection = { name: '', phone: '', id_last4: '', location: '', venue: '', day: '', time: '' };
          const recordsList = document.getElementById('records-list');
          if (recordsList) recordsList.innerHTML = '';
          disableVenueButtons();
          disableDateButtons();
          disableTimeButtons();
        });
      }

      if (adminBtn) {
        adminBtn.addEventListener('click', () => {
          const adminPassword = 'MRT_Beitou@2026!';
          const inputPassword = prompt('請輸入管理密碼');

          if (inputPassword === null) {
            return;
          }

          if (inputPassword !== adminPassword) {
            alert('密碼錯誤，請重新輸入。');
            return;
          }

          if (adminModal) adminModal.classList.add('active');
          renderAdminTable();
        });
      }

      if (closeAdmin) {
        closeAdmin.addEventListener('click', () => {
          if (adminModal) adminModal.classList.remove('active');
        });
      }

      if (adminModal) {
        adminModal.addEventListener('click', (e) => {
          if (e.target.id === 'admin-modal') {
            adminModal.classList.remove('active');
          }
        });
      }

      if (closeRules) {
        closeRules.addEventListener('click', () => {
          if (rulesModal) rulesModal.classList.remove('active');
        });
      }

      if (rulesModal) {
        rulesModal.addEventListener('click', (e) => {
          if (e.target.id === 'rules-modal') {
            rulesModal.classList.remove('active');
          }
        });
      }

      if (submitBtn) {
        submitBtn.addEventListener('click', async (e) => {
          e.preventDefault();
          await submitRegistration();
        });
      }
    }
  </script>
 </body>
</html>
